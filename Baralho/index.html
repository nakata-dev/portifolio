<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tabela de Pontuação</title>
<style>
    body {
        background: #0d0d0d;
        color: #fff;
        font-family: Arial, sans-serif;
        padding: 16px;
    }

    h2 {
        text-align: center;
        margin-bottom: 12px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: #151515;
        border-radius: 10px;
        overflow: hidden;
        font-size: 16px;
    }

    th, td {
        border: 1px solid #333;
        padding: 8px;
        text-align: center;
        position: relative;
        min-width: 48px;
    }

    th {
        background: #1f1f1f;
        font-size: 15px;
    }

    select {
        background: #1e1e1e;
        color: #fff;
        border: 1px solid #444;
        padding: 5px;
        border-radius: 5px;
        width: 100%;
        font-size: 13px;
    }

    input {
        width: 100%;
        background: transparent;
        border: none;
        border-bottom: 1px solid #444;
        color: #fff;
        text-align: center;
        padding: 5px;
        font-size: 14px;
        outline: none;
    }

    .score {
        cursor: pointer;
        user-select: none;
        font-size: 18px;
        padding: 5px;
    }

    /* ÍCONES MAIORES E CENTRALIZADOS */
    .icon {
        font-size: 30px;
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.92;
    }

    .buttons {
        margin-top: 14px;
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
    }

    button {
        background: #1f1f1f;
        border: 1px solid #444;
        padding: 10px 14px;
        color: #fff;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
    }

    button:hover{
        background: #333;
    }

    /* RESPONSIVIDADE */
    @media (max-width: 720px) {
        table { font-size: 13px; }
        th, td { padding: 6px; font-size: 12px; }
        select, input { font-size: 12px; }
        .icon { font-size: 24px; }
    }
    footer{
        margin-top: 20px;
        text-align: center;
        font-size: 14px;
        color: #666;
    }
</style>
</head>
<body>

<h2>Tabela de Pontuação</h2>
<table id="tabela">
    <thead>
        <tr id="topo-nomes">
            <th>Nome</th>
        </tr>
    </thead>
    <tbody id="jogadores"></tbody>
</table>

<div class="buttons">
    <button id="novoBtn">Novo jogo</button>
    <button id="addBtn">Adicionar</button>
    <button id="limparBtn" title="Apaga nomes salvos">Limpar nomes</button>
</div>
<footer>
    copyright © Ailton A. Nakata - 2025
</footer>
<script>
/* Configurações */
const rodadas = 10;
const maxJogadores = 9;
const STORAGE_KEY = 'scoreboard_names_v1';

/* Estado */
let nomes = [];        // array com nomes (string)
let jogadoresAtuais = 0;

/* ----- Funções de storage ----- */
function salvarNomes() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(nomes));
    } catch (e) {
        console.warn("Não foi possível salvar no localStorage:", e);
    }
}

function carregarNomes() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return false;
        const arr = JSON.parse(raw);
        if (Array.isArray(arr)) {
            nomes = arr.slice(0, maxJogadores);
            jogadoresAtuais = nomes.length;
            return true;
        }
    } catch (e) {
        console.warn("Erro ao carregar nomes:", e);
    }
    return false;
}

function limparNomesSalvos() {
    localStorage.removeItem(STORAGE_KEY);
    nomes = [];
    jogadoresAtuais = 0;
    gerarTabela();
    gerarTopo();
}

/* ----- Render ----- */
function gerarTopo() {
    const topo = document.getElementById("topo-nomes");
    topo.innerHTML = "<th>Nome</th>";

    // Para cada rodada adiciona um select com as opções dos nomes (abreviados)
    for (let i = 0; i < rodadas; i++) {
        const opcoes = nomes
            .filter(n => n && n.trim() !== "")
            .map(n => `<option>${escapeHtml(n.substring(0,3)).toUpperCase()}</option>`)
            .join("");
        topo.innerHTML += `<th><select>${opcoes}</select></th>`;
    }
}

function gerarTabela() {
    const tbody = document.getElementById("jogadores");
    tbody.innerHTML = "";

    // gera linhas de acordo com jogadoresAtuais (se 0, inicia com 4 vazios como antes)
    if (jogadoresAtuais === 0) {
        // se não há nomes salvos, iniciar com 4 linhas vazias (comportamento anterior)
        jogadoresAtuais = 4;
        nomes = Array(jogadoresAtuais).fill("");
        salvarNomes();
    }

    for (let i = 0; i < jogadoresAtuais; i++) {
        const valor = nomes[i] || "";
        let linha = `<tr>
            <td>
                <input placeholder="Jogador ${i+1}" 
                       value="${escapeHtml(valor)}"
                       oninput="onInputNome(${i}, this.value)" />
            </td>`;

        for (let j = 0; j < rodadas; j++) {
            linha += `<td onclick="abrirMenu(this)">
                        <span class='score'>-</span>
                      </td>`;
        }

        linha += "</tr>";
        tbody.insertAdjacentHTML('beforeend', linha);
    }

    gerarTopo();
}

/* ----- Helpers e eventos para nomes ----- */
function onInputNome(index, valor) {
    nomes[index] = valor;
    salvarNomes();
    gerarTopo(); // atualiza os selects do topo com as 3 primeiras letras
}

function adicionarJogador() {
    if (jogadoresAtuais >= maxJogadores) {
        alert("Limite máximo de 9 jogadores atingido.");
        return;
    }

    // garante que pegamos os valores atuais dos inputs (caso o usuário digitou e não salvou)
    salvarNomesDosInputs();

    nomes.push("");
    jogadoresAtuais++;
    salvarNomes();

    // Recria a tabela (assim mantemos consistência das posições)
    gerarTabela();
}

/* Lê todos os inputs existentes e atualiza 'nomes' antes de operações que re-renderizam */
function salvarNomesDosInputs() {
    const inputs = Array.from(document.querySelectorAll("#jogadores input"));
    inputs.forEach((inp, idx) => {
        nomes[idx] = inp.value || "";
    });
    // corta nomes caso inputs tenham sido removidos
    nomes = nomes.slice(0, playersCountFromDOM());
    salvarNomes();
}

function playersCountFromDOM() {
    return document.querySelectorAll("#jogadores tr").length;
}

/* ----- Menu de pontuação (dropdown temporário) ----- */
function abrirMenu(celula) {
    // antes de re-render criar menu, salvamos nomes dos inputs atuais
    salvarNomesDosInputs();

    const menu = document.createElement("select");
    menu.innerHTML = `
        <option value="">-</option>
        <option value="10">10</option>
        <option value="9">9</option>
        <option value="8">8</option>
        <option value="7">7</option>
        <option value="6">6</option>
        <option value="5">5</option>
        <option value="4">4</option>
        <option value="3">3</option>
        <option value="2">2</option>
        <option value="1">1</option>
        <option value="0">0</option>
        <option value="T">▲</option>
        <option value="C">○</option>
    `;

    // posiciona para cobrir a célula inteira
    menu.style.position = "absolute";
    menu.style.left = "0";
    menu.style.top = "0";
    menu.style.width = "100%";
    menu.style.height = "100%";
    menu.style.zIndex = 999;

    celula.appendChild(menu);
    menu.focus();

    menu.onchange = () => {
        const val = menu.value;
        celula.innerHTML = "";

        if (val === "T") {
            celula.innerHTML = `<div class="icon">▲</div>`;
        } else if (val === "C") {
            celula.innerHTML = `<div class="icon">○</div>`;
        } else {
            celula.innerHTML = `<span class="score">${val || "-"}</span>`;
        }
    };

    // fechar o select se clicar fora (UX melhor)
    menu.addEventListener('blur', () => {
        // se não escolheu nada, volta para '-'
        if (!menu.value) {
            celula.innerHTML = `<span class="score">-</span>`;
        }
    });
}

/* ----- Novo jogo (zera somente pontuações) ----- */
function novoJogo() {
    document.querySelectorAll(".score").forEach(s => s.innerText = "-");
    document.querySelectorAll(".icon").forEach(i => i.remove());
}

/* ----- Inicialização ----- */
function init() {
    const had = carregarNomes();
    if (!had) {
        // sem nomes salvos -> inicia com 4 linhas vazias
        nomes = Array(4).fill("");
        jogadoresAtuais = 4;
        salvarNomes();
    } else {
        jogadoresAtuais = nomes.length;
        if (jogadoresAtuais === 0) {
            // se storage existia mas vazio, inicializa 4 linhas vazias
            nomes = Array(4).fill("");
            jogadoresAtuais = 4;
            salvarNomes();
        }
    }

    gerarTabela();
    gerarTopo();

    // botões
    document.getElementById('novoBtn').addEventListener('click', novoJogo);
    document.getElementById('addBtn').addEventListener('click', adicionarJogador);
    document.getElementById('limparBtn').addEventListener('click', () => {
        if (confirm("Deseja apagar todos os nomes salvos?")) limparNomesSalvos();
    });
}

function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, function(m) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
}

init();
</script>
</body>
</html>
