<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tabela de Pontuação</title>

<style>
    body {
        background: #0d0d0d;
        color: #fff;
        font-family: Arial, sans-serif;
        padding: 16px;
    }

    h2 {
        text-align: center;
        margin-bottom: 12px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: #151515;
        border-radius: 10px;
        overflow: hidden;
        font-size: 16px;
    }

    th, td {
        border: 1px solid #333;
        padding: 8px;
        text-align: center;
        position: relative;
        min-width: 48px;
    }

    th {
        background: #1f1f1f;
        font-size: 15px;
    }

    select {
        background: #1e1e1e;
        color: #fff;
        border: 1px solid #444;
        padding: 5px;
        border-radius: 5px;
        width: 100%;
        font-size: 13px;
    }

    input {
        width: 100%;
        background: transparent;
        border: none;
        border-bottom: 1px solid #444;
        color: #fff;
        text-align: center;
        padding: 5px;
        font-size: 14px;
        outline: none;
    }

    .score {
        cursor: pointer;
        user-select: none;
        font-size: 18px;
        padding: 5px;
        display: inline-block;
        width: 100%;
    }

    .icon-symbol {
        position: absolute;
        top: 2px;
        right: 4px;
        font-size: 16px;
        opacity: 0.9;
        pointer-events: none;
    }

    .buttons {
        margin-top: 14px;
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
    }

    button {
        background: #1f1f1f;
        border: 1px solid #444;
        padding: 10px 14px;
        color: #fff;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
    }

    button:hover{
        background: #333;
    }

    @media (max-width: 720px) {
        table { font-size: 13px; }
        th, td { padding: 6px; font-size: 12px; }
        select, input { font-size: 12px; }
        .icon-symbol { font-size: 14px; }
    }

    footer{
        margin-top: 20px;
        text-align: center;
        font-size: 14px;
        color: #666;
    }
</style>
</head>
<body>

<h2>Tabela de Pontuação</h2>

<table id="tabela">
    <thead>
        <tr id="topo-nomes">
            <th>Nome</th>
        </tr>
    </thead>
    <tbody id="jogadores"></tbody>
</table>

<div class="buttons">
    <button id="novoBtn">Novo jogo</button>
    <button id="addBtn">Adicionar</button>
    <button id="limparBtn" title="Apaga nomes salvos">Limpar nomes</button>
</div>

<footer>
    copyright © Ailton A. Nakata - 2025
</footer>

<script>
/* Configurações */
const rodadas = 10;
const maxJogadores = 9;
const STORAGE_KEY = 'scoreboard_names_v2';

/* Estado */
let nomes = [];
let jogadoresAtuais = 0;

/* ---------- STORAGE ---------- */
function salvarNomes() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(nomes));
}

function carregarNomes() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return false;

        const arr = JSON.parse(raw);
        if (!Array.isArray(arr)) return false;

        nomes = arr.slice(0, maxJogadores);
        jogadoresAtuais = nomes.length;
        return true;
    } catch {
        return false;
    }
}

function limparNomesSalvos() {
    localStorage.removeItem(STORAGE_KEY);
    nomes = [];
    jogadoresAtuais = 0;
    gerarTabela();
    gerarTopo();
}

/* ---------- RENDER ---------- */
function gerarTopo() {
    const topo = document.getElementById("topo-nomes");
    topo.innerHTML = "<th>Nome</th>";

    const opcoes = nomes
        .map(n => `<option>${escapeHtml(n.substring(0,3).toUpperCase())}</option>`)
        .join("");

    for (let i = 0; i < rodadas; i++) {
        topo.innerHTML += `<th><select>${opcoes}</select></th>`;
    }
}

function gerarTabela() {
    const tbody = document.getElementById("jogadores");
    tbody.innerHTML = "";

    if (jogadoresAtuais === 0) {
        jogadoresAtuais = 4;
        nomes = Array(4).fill("");
        salvarNomes();
    }

    for (let i = 0; i < jogadoresAtuais; i++) {
        let linha = `
        <tr>
            <td>
                <input value="${escapeHtml(nomes[i] || "")}"
                       placeholder="Jogador ${i+1}"
                       oninput="onInputNome(${i}, this.value)">
            </td>`;

        for (let j = 0; j < rodadas; j++) {
            linha += `
            <td class="cell-ponto">
                <span class="score">-</span>
            </td>`;
        }

        linha += "</tr>";
        tbody.insertAdjacentHTML("beforeend", linha);
    }

    gerarTopo();
}

/* ---------- Nomes ---------- */
function onInputNome(index, valor) {
    nomes[index] = valor;
    salvarNomes();
    gerarTopo();
}

function adicionarJogador() {
    if (jogadoresAtuais >= maxJogadores) {
        alert("Limite máximo de 9 jogadores atingido.");
        return;
    }

    salvarNomesDosInputs();
    nomes.push("");
    jogadoresAtuais++;
    salvarNomes();
    gerarTabela();
}

function salvarNomesDosInputs() {
    document.querySelectorAll("#jogadores input").forEach((inp, i) => {
        nomes[i] = inp.value;
    });
    salvarNomes();
}

/* ---------- MENU EM CELULAR (pointerdown) ---------- */
document.addEventListener("pointerdown", function(e) {
    const celula = e.target.closest(".cell-ponto");
    if (celula) abrirMenu(celula);
});

/* ---------- MENU DE PONTOS ---------- */
function abrirMenu(celula) {

    celula.innerHTML = ""; // limpa conteúdo

    const menu = document.createElement("select");
    menu.innerHTML = `
        <option value="">-</option>
        <option value="10">10</option>
        <option value="9">9</option>
        <option value="8">8</option>
        <option value="7">7</option>
        <option value="6">6</option>
        <option value="5">5</option>
        <option value="4">4</option>
        <option value="3">3</option>
        <option value="2">2</option>
        <option value="1">1</option>
        <option value="0">0</option>
        <option value="T">▲</option>
        <option value="C">○</option>
    `;

    menu.style.position = "absolute";
    menu.style.top = 0;
    menu.style.left = 0;
    menu.style.width = "100%";
    menu.style.height = "100%";
    menu.style.zIndex = "999";

    celula.appendChild(menu);
    menu.focus();

    menu.onchange = () => atualizarCelula(celula, menu.value);
    menu.onblur   = () => atualizarCelula(celula, menu.value);
}

function atualizarCelula(celula, val) {
    celula.innerHTML = "";

    let numero = "-";

    if (!isNaN(val) && val !== "") {
        numero = val;
    }

    celula.innerHTML = `<span class="score">${numero}</span>`;

    if (val === "T") {
        celula.innerHTML += `<span class="icon-symbol">▲</span>`;
    }

    if (val === "C") {
        celula.innerHTML += `<span class="icon-symbol">○</span>`;
    }
}

/* ---------- NOVO JOGO ---------- */
function novoJogo() {
    document.querySelectorAll(".cell-ponto").forEach(td => {
        td.innerHTML = `<span class="score">-</span>`;
    });
}

/* ---------- UTILS ---------- */
function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, m => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[m]));
}

/* ---------- INIT ---------- */
function init() {
    if (!carregarNomes()) {
        nomes = Array(4).fill("");
        jogadoresAtuais = 4;
        salvarNomes();
    }

    gerarTabela();
    gerarTopo();

    document.getElementById("addBtn").onclick = adicionarJogador;
    document.getElementById("novoBtn").onclick = novoJogo;
    document.getElementById("limparBtn").onclick = () => {
        if (confirm("Apagar nomes salvos?")) limparNomesSalvos();
    };
}

init();
</script>
</body>
</html>
