<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tabela de Pontuação</title>

<style>
/* -------------------- ESTILO BASE -------------------- */
body {
    background: #0d0d0d;
    color: #fff;
    font-family: Arial, sans-serif;
    padding: 16px;
}

h2 {
    text-align: center;
    margin-bottom: 12px;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: #151515;
    border-radius: 10px;
    overflow: hidden;
    font-size: 16px;
}

th, td {
    border: 1px solid #333;
    padding: 8px;
    text-align: center;
    position: relative;
    min-width: 48px;
}

th {
    background: #1f1f1f;
    font-size: 15px;
}

input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid #444;
    color: #fff;
    text-align: center;
    padding: 5px;
    font-size: 14px;
    outline: none;
}

.score {
    cursor: pointer;
    user-select: none;
    font-size: 18px;
    padding: 5px;
    display: inline-block;
    width: 100%;
}

.icon-symbol {
    position: absolute;
    top: 2px;
    right: 4px;
    font-size: 16px;
    opacity: 0.9;
    pointer-events: none;
}

.buttons {
    margin-top: 14px;
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
}

button {
    background: #1f1f1f;
    border: 1px solid #444;
    padding: 10px 14px;
    color: #fff;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
}

button:hover{
    background: #333;
}

@media (max-width: 720px) {
    table { font-size: 13px; }
    th, td { padding: 6px; font-size: 12px; }
    .icon-symbol { font-size: 14px; }
}

footer{
    margin-top: 20px;
    text-align: center;
    font-size: 14px;
    color: #666;
}


/* -------------------- BOTTOM SHEET MODERNO -------------------- */
#bottomSheetOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: none;
    z-index: 99999;
}

#bottomSheet {
    position: fixed;
    left: 0;
    bottom: -400px;
    width: 100%;
    background: #1c1c1c;
    border-radius: 16px 16px 0 0;
    padding: 16px;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
    transition: bottom 0.28s ease;
}

.sheet-title {
    text-align: center;
    font-size: 17px;
    margin-bottom: 10px;
    opacity: 0.9;
}

.sheet-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-bottom: 14px;
}

.sheet-btn {
    background: #262626;
    border: 1px solid #444;
    padding: 12px 0;
    color: white;
    border-radius: 8px;
    text-align: center;
    font-size: 16px;
    cursor: pointer;
}

.sheet-btn:hover {
    background: #333;
}

#cancelSheet {
    width: 100%;
    padding: 12px;
    background: #333;
    border-radius: 8px;
    text-align: center;
    margin-top: 10px;
    cursor: pointer;
}

</style>
</head>
<body>

<h2>Tabela de Pontuação</h2>

<table id="tabela">
    <thead>
        <tr id="topo-nomes">
            <th>Nome</th>
        </tr>
    </thead>
    <tbody id="jogadores"></tbody>
</table>

<div class="buttons">
    <button id="novoBtn">Novo jogo</button>
    <button id="addBtn">Adicionar</button>
    <button id="limparBtn" title="Apaga nomes salvos">Limpar nomes</button>
</div>

<footer>
    copyright © Ailton A. Nakata - 2025
</footer>

<!-- ---------------- BOTTOM SHEET ---------------- -->
<div id="bottomSheetOverlay"></div>

<div id="bottomSheet">
    <div class="sheet-title">Selecione o número</div>

    <div id="numerosContainer" class="sheet-grid"></div>

    <div class="sheet-title">Selecione o símbolo</div>
    <div id="simbolosContainer" class="sheet-grid">
        <div class="sheet-btn" data-symbol="">Nenhum</div>
        <div class="sheet-btn" data-symbol="▲">▲</div>
        <div class="sheet-btn" data-symbol="○">○</div>
    </div>

    <div id="cancelSheet">Cancelar</div>
</div>

<script>
/* -----------------------------------------------------------
   SISTEMA PRINCIPAL
----------------------------------------------------------- */
const rodadas = 10;
const maxJogadores = 9;
const STORAGE_KEY = 'scoreboard_names_v2';

let nomes = [];
let jogadoresAtuais = 0;
let celulaAtual = null;

/* ------------------------- STORAGE ------------------------- */
function salvarNomes() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(nomes));
}

function carregarNomes() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return false;

        const arr = JSON.parse(raw);
        if (!Array.isArray(arr)) return false;

        nomes = arr.slice(0, maxJogadores);
        jogadoresAtuais = nomes.length;
        return true;
    } catch {
        return false;
    }
}

function limparNomesSalvos() {
    localStorage.removeItem(STORAGE_KEY);
    nomes = [];
    jogadoresAtuais = 0;
    gerarTabela();
    gerarTopo();
}

/* ------------------------- RENDER ------------------------- */
function gerarTopo() {
    const topo = document.getElementById("topo-nomes");
    topo.innerHTML = "<th>Nome</th>";

    const opcoes = nomes
        .map(n => `<option>${escapeHtml(n.substring(0,3).toUpperCase())}</option>`)
        .join("");

    for (let i = 0; i < rodadas; i++) {
        topo.innerHTML += `<th><select>${opcoes}</select></th>`;
    }
}

function gerarTabela() {
    const tbody = document.getElementById("jogadores");
    tbody.innerHTML = "";

    if (jogadoresAtuais === 0) {
        jogadoresAtuais = 4;
        nomes = Array(4).fill("");
        salvarNomes();
    }

    for (let i = 0; i < jogadoresAtuais; i++) {
        let linha = `
        <tr>
            <td>
                <input value="${escapeHtml(nomes[i] || "")}"
                       placeholder="Jogador ${i+1}"
                       oninput="onInputNome(${i}, this.value)">
            </td>`;

        for (let j = 0; j < rodadas; j++) {
            linha += `
            <td class="cell-ponto">
                <span class="score">-</span>
            </td>`;
        }

        linha += "</tr>";
        tbody.insertAdjacentHTML("beforeend", linha);
    }

    gerarTopo();
}

function onInputNome(i, v){
    nomes[i] = v;
    salvarNomes();
    gerarTopo();
}

function adicionarJogador(){
    if(jogadoresAtuais >= maxJogadores){
        alert("Limite máximo de 9 jogadores atingido.");
        return;
    }
    document.querySelectorAll("#jogadores input").forEach((inp,i)=>{
        nomes[i]=inp.value;
    });

    nomes.push("");
    jogadoresAtuais++;
    salvarNomes();
    gerarTabela();
}

/* ----------------- EVENTO PARA ABRIR PAINEL ----------------- */
document.addEventListener("pointerdown", e => {
    const celula = e.target.closest(".cell-ponto");
    if (celula) abrirBottomSheet(celula);
});

/* -----------------------------------------------------------
   BOTTOM SHEET MODERNO
----------------------------------------------------------- */
const overlay = document.getElementById("bottomSheetOverlay");
const sheet = document.getElementById("bottomSheet");
const numerosContainer = document.getElementById("numerosContainer");

function abrirBottomSheet(celula){
    celulaAtual = celula;

    // criar botões dos números
    numerosContainer.innerHTML = "";
    for(let n=10; n>=0; n--){
        numerosContainer.innerHTML += `<div class="sheet-btn" data-num="${n}">${n}</div>`;
    }

    overlay.style.display = "block";
    setTimeout(()=>{ sheet.style.bottom = "0"; }, 10);
}

function fecharBottomSheet(){
    sheet.style.bottom = "-400px";
    setTimeout(()=>{ overlay.style.display = "none"; }, 250);
}

overlay.onclick = fecharBottomSheet;
document.getElementById("cancelSheet").onclick = fecharBottomSheet;

/* escolha do número */
numerosContainer.onclick = e => {
    const btn = e.target.closest(".sheet-btn");
    if(!btn) return;

    const numero = btn.dataset.num;
    celulaAtual.dataset.numeroSelecionado = numero;

    atualizarCelula();
};

/* escolha do símbolo */
simbolosContainer.onclick = e => {
    const btn = e.target.closest(".sheet-btn");
    if(!btn) return;

    const simbolo = btn.dataset.symbol;
    celulaAtual.dataset.simboloSelecionado = simbolo;

    atualizarCelula();
    fecharBottomSheet();
};

/* ------------ aplica na célula ------------ */
function atualizarCelula(){
    const numero = celulaAtual.dataset.numeroSelecionado || "-";
    const simbolo = celulaAtual.dataset.simboloSelecionado || "";

    celulaAtual.innerHTML = `<span class="score">${numero}</span>`;

    if (simbolo){
        celulaAtual.innerHTML += `<span class="icon-symbol">${simbolo}</span>`;
    }
}

/* ---------- NOVO JOGO ---------- */
function novoJogo() {
    document.querySelectorAll(".cell-ponto").forEach(td => {
        td.innerHTML = `<span class="score">-</span>`;
        td.dataset.numeroSelecionado = "";
        td.dataset.simboloSelecionado = "";
    });
}

/* ---------- UTILS ---------- */
function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, m => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[m]));
}

/* ---------- INIT ---------- */
function init(){
    if(!carregarNomes()){
        nomes = Array(4).fill("");
        jogadoresAtuais = 4;
        salvarNomes();
    }

    gerarTabela();
    gerarTopo();

    document.getElementById("addBtn").onclick = adicionarJogador;
    document.getElementById("novoBtn").onclick = novoJogo;
    document.getElementById("limparBtn").onclick = ()=>{
        if(confirm("Apagar nomes salvos?")) limparNomesSalvos();
    };
}
init();
</script>

</body>
</html>
