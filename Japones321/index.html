<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <meta name="theme-color" content="#070a11" />
  <meta
    name="description"
    content="NIHONGO321 é um app mobile-first de japonês funcional para brasileiros no Japão. Frases úteis, treino rápido e repetição progressiva para o cotidiano real."
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="NIHONGO321" />
  <meta name="apple-mobile-web-app-title" content="NIHONGO321" />

  <meta property="og:title" content="NIHONGO321" />
  <meta
    property="og:description"
    content="Aprenda japonês útil de forma leve, rápida e funcional, com poucos minutos por dia."
  />
  <meta property="og:type" content="website" />

  <title>NIHONGO321 · Japonês útil para o Japão real</title>

  <link rel="icon" href="./img/favicon.png" type="image/png" />
  <link rel="shortcut icon" href="./img/favicon.png" type="image/x-icon" />

  <!-- arquivo CSS único e padronizado -->
  <link rel="stylesheet" href="../Japones321/style.css">
</head>

<body>
  <a class="skip-link" href="#app">Pular para o conteúdo</a>

  <!-- APP SHELL -->
  <div class="shell" id="shell">
    <!-- HEADER FIXO -->
    <header class="topbar" role="banner">
      <div class="brand" aria-label="Marca NIHONGO321">
        <div class="logo" aria-hidden="true"></div>

        <div class="brandText">
          <p class="brandEyebrow">Japonês funcional</p>
          <h1 class="brandTitle">NIHONGO321</h1>
          <p class="brandSub" id="subStatus">0 ciclos • 0 dominadas</p>
        </div>
      </div>

      <nav class="hud" aria-label="Ações rápidas">
        <div class="hudItem" title="Moedas">
          <span class="hudIcon" aria-hidden="true">🪙</span>
          <span id="hudCoinsVal">0</span>
        </div>

        <button
          class="hudBtn"
          id="hudSound"
          type="button"
          title="Som"
          aria-label="Alternar som"
        >
          🔊
        </button>

        <button
          class="hudBtn"
          id="hudVibe"
          type="button"
          title="Vibração"
          aria-label="Alternar vibração"
        >
          📳
        </button>

        <button
          class="hudBtn"
          id="hudSettings"
          type="button"
          title="Ajustes"
          aria-label="Abrir ajustes"
          onclick="location.hash='#/settings'"
        >
          ⚙️
        </button>
      </nav>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main
      class="app"
      id="app"
      role="main"
      aria-live="polite"
      aria-busy="false"
      tabindex="-1"
    ></main>

    <!-- FOOTER FIXO -->
    <footer class="footerbar" role="contentinfo">
      <div class="footerText">
        NIHONGO321 · Japonês útil para o Japão real
      </div>
    </footer>
  </div>

  <!-- FEEDBACK GLOBAL -->
  <div class="toast" id="toast" aria-live="polite" aria-atomic="true"></div>

  <!-- JS -->
  <script src="app.js" defer></script>
</body>
</html>
