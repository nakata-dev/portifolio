<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
    *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    }
    .container{
    display:grid; /*TRANSFORMA O DISPLAY UM TABULEIRO COM LINHAS E COLUNAS*/
    grid-template-rows: repeat(3, 200px);/*CRIE TRÊS LINHAS, TODAS COM 200PX */
    grid-template-columns: repeat(4, 1fr); /*CRIE QUATRO COLUNAS DE UMAS FRAÇÃO CADA UMA*/
    gap: 5px;
    }

    .caixa1{
    /*como simplificar:*/
    grid-row:1/1;
    grid-column: 1/5;
    background-color: salmon;
    }

    .caixa2{
    grid-row: 2/4;
    grid-column: 1/3;
    background-color: lightskyblue;
    }

    .caixa3{
    grid-row: 2/4;
    grid-column: 3/5;
    background-color: lightgreen;
    }
        
    </style>
    <title>GRID LAYOUT</title>
</head>
<body>
    <div class="container">
        <div class="caixa1">Caixa 01 </div>
        <div class="caixa2">Caixa 02</div>
        <div class="caixa3">Caixa 03</div>
    </div>
</body>
</html>
