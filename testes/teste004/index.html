<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../style.css">
  <title>Verificador de Nacionalidade</title>

  <!-- Fonte moderna -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    /* ======== ESTILO GLOBAL ======== */
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-dark: #1e40af;
      --text: #111827;
      --muted: #6b7280;
      --radius: 12px;
      --shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Poppins", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /*
    header {
      background: var(--primary);
      color: white;
      text-align: center;
      padding: 20px 10px;
      border-bottom: 4px solid var(--primary-dark);
      box-shadow: var(--shadow);
    }

    header h1 {
      font-size: 1.8rem;
      margin-bottom: 5px;
    }

    header p {
      font-size: 0.9rem;
      color: #e0e7ff;
    }*/

    section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: start;
      padding: 30px 10px;
      gap: 20px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 25px;
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .card h2 {
      font-size: 1.3rem;
      color: var(--primary-dark);
      margin-bottom: 15px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
    }

    label {
      font-weight: 600;
      color: var(--text);
    }

    input[type="text"] {
      padding: 10px;
      border-radius: var(--radius);
      border: 1px solid #cbd5e1;
      font-size: 1rem;
      outline: none;
      transition: 0.3s;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 6px rgba(37, 99, 235, 0.3);
    }

    button {
      background: var(--primary);
      color: white;
      font-weight: 600;
      border: none;
      border-radius: var(--radius);
      padding: 10px 20px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: var(--primary-dark);
    }

    #resultado {
      margin-top: 15px;
      font-size: 1.2rem;
      font-weight: 600;
    }

    /*
    #voltar a {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: var(--primary);
      color: white;
      text-decoration: none;
      border-radius: var(--radius);
      font-weight: 600;
      transition: background 0.2s ease-in-out;
    }

    #voltar a:hover {
      background: var(--primary-dark);
    }
    */

    footer {
      text-align: center;
      padding: 15px;
      font-size: 0.85rem;
      color: var(--muted);
      background: #e5e7eb;
    }

    @media (max-width: 600px) {
      .card {
        width: 90%;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Verificador de Nacionalidade</h1>
    <p>por: Ailton A. Nakata</p>
  </header>

  <section>
    <div class="card">
      <h2>Informe seu país de origem</h2>

      <div class="input-group">
        <label for="pais">Digite o nome do país:</label>
        <input type="text" id="pais" placeholder="Ex: Brasil, Japão, Portugal...">
      </div>

      <button onclick="verificarNacionalidade()">Verificar</button>
      <p id="resultado"></p>
      <div id="voltar">
        <a href="../../testes.html"> Voltar</a>
      </div>
    </div>

  </section>

  <footer>
    &copy; 2025 • Ailton A. Nakata — Todos os direitos reservados.
  </footer>

  <script>
    /**
     * Função principal: verifica se o país digitado é "Brasil"
     * e exibe a mensagem correspondente.
     */
    function verificarNacionalidade() {
      const paisInput = document.getElementById("pais").value.trim();
      const resultado = document.getElementById("resultado");

      // Se o campo estiver vazio
      if (paisInput === "") {
        resultado.textContent = "Por favor, digite o nome de um país!";
        resultado.style.color = "#b91c1c"; // vermelho
        return;
      }

      // Normaliza o texto (remove acentos e compara em minúsculas)
      const paisNormalizado = paisInput.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

      if (paisNormalizado === "brasil") {
        resultado.textContent = "Você é brasileiro 🇧🇷";
        resultado.style.color = "#16a34a"; // verde
      } else {
        resultado.textContent = `Você é estrangeiro 🌍 (origem: ${paisInput})`;
        resultado.style.color = "#1d4ed8"; // azul
      }

      console.log(`Vivendo no ${paisInput}`);
    }
  </script>
</body>
</html>
