<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#070a11" />
  <meta name="description" content="Nihongo321 - Japonês funcional para brasileiros no Japão. Ouça, repita e use frases reais do cotidiano." />
  <title>NIHONGO321</title>

  <link rel="stylesheet" href="./styles.css?v=4.0.0" />
  <link rel="shortcut icon" href="./img/favicon.png" type="image/x-icon">
</head>

<body>
  <header class="topbar" role="banner">
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <div class="brandText">
        <div class="brandTitle">NIHONGO321</div>
        <div class="brandSub" id="subStatus">0 ciclos • 0 dominadas</div>
      </div>
    </div>

    <div class="hud" aria-label="HUD">
      <div class="hudItem" title="moedas">
        <span class="hudIcon">🪙</span>
        <span id="hudCoinsVal">0</span>
      </div>
      <button class="hudBtn" id="hudSound" title="som" aria-label="som">🔊</button>
      <button class="hudBtn" id="hudVibe" title="vibração" aria-label="vibração">📳</button>
      <button class="hudBtn" title="ajustes" aria-label="ajustes" data-nav="#/settings">⚙️</button>
    </div>
  </header>

  <main class="app" id="app" role="main"></main>

  <footer class="footerbar" role="contentinfo">
    <div class="footerText">Copyright @ 2026 - Ailton A. Nakata</div>
  </footer>

  <div class="toast" id="toast" aria-live="polite"></div>

  <script src="./app.js?v=4.0.0" defer></script>
</body>
</html>
