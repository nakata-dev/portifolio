<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <meta name="theme-color" content="#17171b" />
  <meta
    name="description"
    content="NIHONGO321 é um app de japonês funcional para brasileiros no Japão. Aprenda frases úteis, evolua com missões e avance com um plano premium real."
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />

  <title>NIHONGO321 · Japonês útil para o Japão real</title>

  <link rel="icon" href="./img/favicon.png" type="image/png" />
  <link rel="shortcut icon" href="./img/favicon.png" type="image/x-icon" />
  <link rel="stylesheet" href="./style.css?v=6.0.0" />
</head>

<body>
  <a class="skip-link" href="#app">Pular para o conteúdo</a>

  <div class="shell">
    <header class="topbar" role="banner">
      <div class="brand" aria-label="Marca NIHONGO321">
        <div class="logo" aria-hidden="true"></div>

        <div class="brandText">
          <p class="brandEyebrow">Japonês funcional</p>
          <h1 class="brandTitle">NIHONGO321</h1>
          <p class="brandSub" id="subStatus">0 ciclos • 0 dominadas</p>
        </div>
      </div>

      <nav class="hud" aria-label="Ações rápidas">
        <div class="hudItem" title="Moedas">
          <span class="hudIcon" aria-hidden="true">🪙</span>
          <span id="hudCoinsVal">0</span>
        </div>

        <button
          class="hudBtn"
          id="hudSound"
          type="button"
          aria-label="Alternar som"
          title="Som"
        >
          🔊
        </button>

        <button
          class="hudBtn"
          id="hudVibe"
          type="button"
          aria-label="Alternar vibração"
          title="Vibração"
        >
          📳
        </button>

        <button
          class="hudBtn"
          id="hudSettings"
          type="button"
          aria-label="Abrir ajustes"
          title="Ajustes"
          onclick="location.hash='#/settings'"
        >
          ⚙️
        </button>
      </nav>
    </header>

    <main
      id="app"
      class="app"
      role="main"
      tabindex="-1"
      aria-live="polite"
      aria-busy="false"
    ></main>

    <footer class="footerbar" role="contentinfo">
      <div class="footerText">NIHONGO321 · Feito para brasileiros no Japão</div>
    </footer>
  </div>

  <div id="toast" class="toast" aria-live="polite" aria-atomic="true"></div>

  <script src="./app.js?v=6.0.0" defer></script>
</body>
</html>
