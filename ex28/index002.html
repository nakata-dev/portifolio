<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Layout | Ailton A. Nakata</title>

  <!-- Padrão do site -->
  <link rel="shortcut icon" href="../../img/Soluções.png" type="image/x-icon">
  <link rel="stylesheet" href="../../site.css">
  <script src="../../site.js" defer></script>

  <style>
    /* ===== Base escura profissional ===== */
    * { box-sizing: border-box; }
    body{
      margin: 0;
      padding: 16px;
      font-family: Arial, Helvetica, sans-serif;
      color: rgba(255,255,255,.92);
      background:
        radial-gradient(900px 360px at 15% 10%, rgba(59,130,246,.14), transparent 55%),
        radial-gradient(860px 320px at 80% 20%, rgba(20,184,166,.10), transparent 60%),
        #0b1220;
    }

    /* Botões padrão acima do título */
    .top-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin: 0 auto 14px;
      max-width: 980px;
      padding: 0 4px;
    }

    /* Remove qualquer hover que bagunce layout */
    a:hover{ transform:none !important; animation:none !important; }

    main{
      max-width: 980px;
      margin: 0 auto;
    }

    h1{
      text-align:center;
      margin: 10px 0 6px;
      color: rgba(255,255,255,.96);
    }

    p{
      text-align:center;
      margin: 0 0 14px;
      color: rgba(255,255,255,.76);
    }

    hr{
      border:0;
      border-top: 1px solid rgba(255,255,255,.12);
      margin: 14px 0;
    }

    /* ===== Card do exemplo ===== */
    .card{
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 16px;
      padding: 14px;
    }

    /* ===== Seu GRID (mesma lógica, visual melhor) ===== */
    .container{
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.03);

      height: 250px;
      display: grid;

      /* Mantido exatamente como você fez (só sem "auto" repetido em linhas) */
      grid-template: repeat(3, auto) / repeat(3, auto);

      gap: 10px;

      /* Mantidos (didática do exemplo) */
      place-items: start center;
      place-content: space-between end;

      border-radius: 16px;
      padding: 12px;

      /* Segurança: não quebrar em telas pequenas */
      overflow: auto;
      max-width: 100%;
    }

    .item{
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.06);
      border-radius: 12px;

      color: rgba(255,255,255,.92);
      font-weight: 800;
      letter-spacing: .3px;

      /* mantém o “tamanho real” do item visível */
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
    }

    /* Voltar antigo some: usamos botões padrão no topo */
    #voltar{ display:none !important; }

    @media (max-width: 520px){
      body{ padding: 12px; }
      .container{ gap: 8px; padding: 10px; }
    }
  </style>
</head>

<body>
  <!-- ✅ Botões padrão acima do título -->
  <div class="top-actions">
    <a class="btn btn-secondary" href="../html.html">Voltar</a>
    <a class="btn btn-ghost" href="../../contato.html">Contato</a>
    <button class="btn btn-primary" data-open-modal type="button">Solicitar orçamento</button>
  </div>

  <main>
    <h1>Grid Layout</h1>
    <p class="muted">Exemplo de <strong>place-items</strong> e <strong>place-content</strong> com layout profissional.</p>
    <hr>

    <div class="card">
      <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
      </div>
    </div>
  </main>

  <!-- Modal padrão (se você usa no site) -->
  <div class="modal-overlay" data-modal-overlay>
    <div class="modal" role="dialog" aria-modal="true" aria-label="Solicitar orçamento">
      <div class="modal-head">
        <strong>Solicitar orçamento</strong>
        <button class="modal-close" data-close-modal aria-label="Fechar" type="button">X</button>
      </div>

      <div class="modal-body">
        <p class="muted">Preencha em 30 segundos. Eu monto a proposta e te respondo.</p>

        <form class="form" data-budget-form autocomplete="on">
          <div class="field">
            <label>Seu nome</label>
            <input name="nome" placeholder="Ex: Ana" required autocomplete="name" />
          </div>

          <div class="field">
            <label>Seu negócio / segmento</label>
            <input name="negocio" placeholder="Ex: Barbearia, pizzaria, clínica..." required />
          </div>

          <div class="field">
            <label>Tipo de site</label>
            <select name="tipo" required>
              <option value="">Selecione</option>
              <option>Landing Page</option>
              <option>Site Institucional</option>
              <option>WordPress</option>
              <option>Loja (e-commerce)</option>
            </select>
          </div>

          <div class="field">
            <label>Objetivo principal</label>
            <select name="objetivo" required>
              <option value="">Selecione</option>
              <option>Gerar contatos no WhatsApp</option>
              <option>Vender um serviço/produto</option>
              <option>Passar credibilidade</option>
              <option>Captar leads (formulário)</option>
            </select>
          </div>

          <div class="field">
            <label>Prazo</label>
            <input name="prazo" placeholder="Ex: 10 dias" />
          </div>

          <div class="field">
            <label>Detalhes (opcional)</label>
            <textarea name="detalhes" placeholder="Páginas, conteúdo, fotos, logotipo, etc."></textarea>
          </div>

          <div class="top-actions" style="margin:12px 0 0; padding:0;">
            <button class="btn btn-primary" type="submit">Enviar no WhatsApp</button>
            <button class="btn btn-ghost" type="button" data-close-modal>Cancelar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
