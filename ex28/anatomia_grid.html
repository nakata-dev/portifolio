<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 03 – Propriedades Container</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }
        h2{
            text-align: center;
        }
        p{
            text-align: justify;
            text-indent: 25px;
            padding: 20px;

        }
    </style>
    
</head>
<body>
    <h1>Propriedades do Container</h1>
        <br>
        <br>
    <pre>
        <code>
            .container{
                display:grid;
                grid-template-columns:auto auto auto;
                grid-template-rows:100px 100px 100px;
                grid-gap: 20px;

            }
        </code>
    </pre>
        
    
    
</body>
</html>
