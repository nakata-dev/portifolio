<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contador de Páginas</title>

  <style>
    :root {
      --bg: #0b0d10;
      --card: #151922;
      --text: #e6e9ef;
      --muted: #9aa4bf;
      --btn: #3b5bff;
      --btn-hover: #2f49d8;
      --accent: #7aa2ff;
    }

    .light {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #111;
      --muted: #555;
      --btn: #4a4aff;
      --btn-hover: #3535e0;
      --accent: #4a4aff;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
      padding: 24px;
      transition: 0.3s;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 24px;
      color: var(--accent);
      letter-spacing: 1px;
    }

    .card {
      background: var(--card);
      padding: 26px;
      border-radius: 18px;
      margin: 20px auto;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    }

    label {
      color: var(--muted);
      font-size: 0.9rem;
    }

    input {
      padding: 14px;
      font-size: 1.1rem;
      border-radius: 12px;
      border: none;
      width: 120px;
      text-align: center;
      background: #0f1320;
      color: var(--text);
      margin-top: 6px;
    }

    button {
      padding: 16px 30px;
      font-size: 1.2rem;
      border-radius: 14px;
      border: none;
      margin: 10px;
      background: var(--btn);
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: var(--btn-hover);
      transform: translateY(-2px);
    }

    #contador {
      font-size: 6rem;
      font-weight: bold;
      margin: 20px 0;
      color: var(--accent);
      text-shadow: 0 0 20px rgba(122, 162, 255, 0.4);
    }

    .acoes button {
      width: 120px;
    }

    footer {
      margin-top: 40px;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>

<body>

  <h1>📖 CONTADOR DE PÁGINAS</h1>

  <div class="card">
    <label>Meta diária</label><br>
    <input type="number" id="meta" value="100" step="10">
    <br>
    <button onclick="definirMeta()">Definir Meta</button>

    <p id="metaInfo">Meta de hoje: 100 páginas</p>

    <div id="contador">0</div>

    <div class="acoes">
      <button onclick="alterar(-10)">−10</button>
      <button onclick="alterar(10)">+10</button>
    </div>
  </div>

  <div class="card">
    <button onclick="resetar()">🔄 Resetar</button>
    <button onclick="toggleTema()">🌙 / ☀️ Tema</button>
  </div>

  <footer>
    Copyright © 2025 Ailton A. Nakata
  </footer>

  <script>
    let contador = 0;
    let meta = 100;
    let tema = localStorage.getItem("tema") || "dark";

    const hoje = new Date().toLocaleDateString();
    const dados = JSON.parse(localStorage.getItem("leitura")) || { historico: {} };

    document.body.classList.toggle("light", tema === "light");

    function salvar() {
      localStorage.setItem("leitura", JSON.stringify(dados));
      localStorage.setItem("tema", tema);
    }

    function definirMeta() {
      meta = Number(document.getElementById("meta").value);
      contador = 0;
      dados.meta = meta;
      dados.historico[hoje] = 0;
      atualizar();
    }

    function alterar(valor) {
      contador += valor;
      if (contador < 0) contador = 0;

      if (contador >= meta) {
        contador = meta;
        alert("🎉 Meta atingida! Excelente leitura!");
      }

      dados.historico[hoje] = contador;
      atualizar();
    }

    function resetar() {
      if (!confirm("Resetar progresso de hoje?")) return;
      contador = 0;
      dados.historico[hoje] = 0;
      atualizar();
    }

    function toggleTema() {
      tema = tema === "dark" ? "light" : "dark";
      document.body.classList.toggle("light");
      salvar();
    }

    function atualizar() {
      document.getElementById("contador").innerText = contador;
      document.getElementById("metaInfo").innerText = `Meta de hoje: ${meta} páginas`;
      salvar();
    }

    window.onload = () => {
      if (dados.meta) meta = dados.meta;
      contador = dados.historico[hoje] || 0;
      document.getElementById("meta").value = meta;
      atualizar();
    };
  </script>

</body>
</html>
