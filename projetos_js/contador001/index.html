<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CONTADOR DE PÁGINAS</title>

  <style>
    :root {
      --bg: #0f0f0f;
      --text: #e4e4e4;
      --card: #1a1a1a;
      --btn: #2222ff;
    }

    .light {
      --bg: #f5f5f5;
      --text: #111;
      --card: #ffffff;
      --btn: #4a4aff;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      transition: 0.3s;
    }

    h1 {
      font-size: 1.8rem;
    }

    input, button {
      padding: 14px;
      font-size: 1.2rem;
      border-radius: 10px;
      border: none;
      margin: 6px;
    }

    button {
      background: var(--btn);
      color: white;
      cursor: pointer;
      font-size: 1.4em;
      padding: 20px 35px;
      border-radius: 10px;
    }

    button:hover {
      opacity: 0.9;
    }

    #contador {
      font-size: 6rem;
      margin: 20px 0;
    }

    .card {
      background: var(--card);
      padding: 20px;
      border-radius: 14px;
      margin: 20px auto;
      max-width: 400px;
    }

    canvas {
      max-width: 100%;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>📖 CONTADOR DE PÁGINAS</h1>

  <div class="card">
    <label>Meta diária</label><br>
    <input type="number" id="meta" value="100" step="10">
    <button onclick="definirMeta()">Definir</button>

    <p id="metaInfo">Meta de hoje: 100 páginas</p>
    <div id="contador">0</div>

    <button onclick="alterar(-10)">-10</button>
    <button onclick="alterar(10)">+10</button>
  </div>

  <div class="card">
    <button onclick="resetar()">🔄 Resetar</button>
    <button onclick="toggleTema()">🌙 / ☀️ Tema</button>
  </div>

  <div class="card">
    <h3>📊 Últimos 7 dias</h3>
    <canvas id="grafico" height="200"></canvas>
  </div>

  <script>
    let contador = 0;
    let meta = 100;
    let tema = localStorage.getItem("tema") || "dark";

    const hoje = new Date().toLocaleDateString();

    const dados = JSON.parse(localStorage.getItem("leitura")) || {
      historico: {}
    };

    document.body.classList.toggle("light", tema === "light");

    function salvar() {
      localStorage.setItem("leitura", JSON.stringify(dados));
      localStorage.setItem("tema", tema);
    }

    function definirMeta() {
      meta = Number(metaInput.value);
      contador = 0;
      dados.meta = meta;
      dados.historico[hoje] = 0;
      atualizar();
    }

    function alterar(v) {
      contador += v;
      if (contador < 0) contador = 0;
      if (contador >= meta) {
        contador = meta;
        alert("🎉 Meta atingida! Excelente leitura!");
      }
      dados.historico[hoje] = contador;
      atualizar();
    }

    function resetar() {
      if (!confirm("Resetar progresso de hoje?")) return;
      contador = 0;
      dados.historico[hoje] = 0;
      atualizar();
    }

    function toggleTema() {
      tema = tema === "dark" ? "light" : "dark";
      document.body.classList.toggle("light");
      salvar();
    }

    function atualizar() {
      document.getElementById("contador").innerText = contador;
      document.getElementById("metaInfo").innerText = `Meta de hoje: ${meta} páginas`;
      salvar();
      desenharGrafico();
    }

    function desenharGrafico() {
      const ctx = document.getElementById("grafico").getContext("2d");
      ctx.clearRect(0, 0, 400, 200);

      const dias = Object.entries(dados.historico).slice(-7);
      const max = Math.max(...dias.map(d => d[1]), meta);

      dias.forEach((d, i) => {
        const h = (d[1] / max) * 150;
        ctx.fillStyle = "#4a4aff";
        ctx.fillRect(40 + i * 45, 180 - h, 30, h);
        ctx.fillText(d[1], 40 + i * 45, 170 - h);
      });
    }

    const metaInput = document.getElementById("meta");

    window.onload = () => {
      if (dados.meta) meta = dados.meta;
      contador = dados.historico[hoje] || 0;
      metaInput.value = meta;
      atualizar();
    };
  </script>
<footer style="margin-top: 40px; font-size: 0.8rem; color: gray;">
  Copyright © 2025 Ailton A. Nakata
</footer>
</body>
</html>
