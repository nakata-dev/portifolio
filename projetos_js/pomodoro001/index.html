<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Focus Timer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <style>
    :root {
      --cor-fundo-principal: #1a1a2e;
      --cor-fundo-secundario: #1e1e40;
      --cor-texto-claro: #e0e0f0;
      --cor-texto-escuro: #c0c0d0;
      --cor-destaque: #ff6a88;
      --cor-botao-primario: #5cb85c;
      --cor-botao-secundario: #f0ad4e;
      --cor-botao-perigo: #d9534f;
      --cor-contorno-circulo: rgba(255, 255, 255, 0.10);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--cor-fundo-principal) 0%, #0a0a1a 100%);
      color: var(--cor-texto-claro);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      background-color: var(--cor-fundo-secundario);
      border-radius: 25px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 0 0 0 5px rgba(255, 255, 255, 0.05);
      padding: 30px;
      max-width: 450px;
      width: 100%;
      text-align: center;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: fadeIn 0.7s ease-out forwards;
    }

    h1 {
      font-size: 2.2rem;
      color: var(--cor-destaque);
      margin-bottom: 25px;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
    }

    .mode-selector {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .mode-selector button {
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--cor-texto-escuro);
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .mode-selector button:hover {
      background-color: rgba(255, 255, 255, 0.2);
      color: var(--cor-texto-claro);
    }

    .mode-selector button.active {
      background-color: var(--cor-destaque);
      color: var(--cor-fundo-principal);
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(255, 106, 136, 0.4);
      transform: translateY(-2px);
    }

    /* Timer */
    .timer-display {
      position: relative;
      width: 250px;
      height: 250px;
      margin: 0 auto 18px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, var(--cor-fundo-secundario) 67%, rgba(255, 255, 255, 0.05) 100%);
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5), 0 0 0 8px var(--cor-contorno-circulo);
      overflow: hidden;
    }

    /* Camada do progresso (conic-gradient) */
    .progress-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(var(--cor-destaque) 0deg, var(--cor-contorno-circulo) 0deg);
      transition: background 0.2s linear;
      opacity: 0.95;
    }

    /* “Janela” interna para parecer um anel */
    .progress-hole {
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at center, var(--cor-fundo-secundario) 70%, rgba(255,255,255,0.03) 100%);
      box-shadow: inset 0 0 18px rgba(0,0,0,0.45);
      z-index: 1;
    }

    #time {
      font-size: 5rem;
      font-weight: 700;
      color: var(--cor-destaque);
      position: relative;
      z-index: 2;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
      letter-spacing: 1px;
    }

    /* Controls */
    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .controls button {
      background-color: var(--cor-botao-primario);
      color: var(--cor-fundo-principal);
      border: none;
      padding: 14px 26px;
      border-radius: 30px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .controls button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3); }
    .controls button:active { transform: translateY(0); }

    .controls button.pause-btn { background-color: var(--cor-botao-secundario); }
    .controls button.reset-btn { background-color: var(--cor-botao-perigo); }

    /* Toggle som */
    .sound-row {
      margin-top: 14px;
      display: flex;
      justify-content: center;
      gap: 10px;
      align-items: center;
      color: var(--cor-texto-escuro);
      font-size: 0.95rem;
    }

    .sound-row button {
      background: rgba(255,255,255,0.08);
      color: var(--cor-texto-claro);
      border: 1px solid rgba(255,255,255,0.10);
      padding: 8px 12px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: 0.25s ease;
    }

    .sound-row button:hover { background: rgba(255,255,255,0.14); }

    #status-message {
      margin-top: 18px;
      font-size: 1.1rem;
      color: var(--cor-texto-escuro);
      min-height: 1.3em;
    }

    footer {
      margin-top: 40px;
      font-size: 0.85rem;
      color: var(--cor-texto-escuro);
      text-align: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .container { padding: 20px; border-radius: 15px; }
      h1 { font-size: 1.8rem; margin-bottom: 18px; }
      .mode-selector button { padding: 8px 15px; font-size: 0.9rem; }
      .timer-display { width: 200px; height: 200px; }
      #time { font-size: 4rem; }
      .controls button { padding: 12px 20px; font-size: 1rem; gap: 6px; }
      #status-message { font-size: 1rem; }
    }

    @media (max-width: 320px) {
      h1 { font-size: 1.5rem; }
      #time { font-size: 3.5rem; }
      .controls button { padding: 10px 15px; font-size: 0.9rem; }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1><i class="fas fa-hourglass-half"></i> Pomodoro Focus Timer</h1>

    <div class="mode-selector">
      <button id="pomodoro-btn" class="active"><i class="fas fa-play-circle"></i> Pomodoro</button>
      <button id="short-break-btn"><i class="fas fa-coffee"></i> Pausa Curta</button>
      <button id="long-break-btn"><i class="fas fa-couch"></i> Pausa Longa</button>
    </div>

    <div class="timer-display" aria-label="Timer Pomodoro">
      <div id="progress-ring" class="progress-ring"></div>
      <div class="progress-hole"></div>
      <span id="time">25:00</span>
    </div>

    <div class="controls">
      <button id="start-btn"><i class="fas fa-play"></i> Iniciar</button>
      <button id="pause-btn" class="pause-btn" style="display: none;"><i class="fas fa-pause"></i> Pausar</button>
      <button id="reset-btn" class="reset-btn"><i class="fas fa-redo"></i> Resetar</button>
    </div>

    <div class="sound-row">
      <span>Som:</span>
      <button id="sound-toggle" type="button" aria-pressed="true">
        <i class="fas fa-volume-up"></i> Ativado
      </button>
      <span id="cycle-info" title="Quantidade de pomodoros concluídos no ciclo">Ciclo: 0/4</span>
    </div>

    <p id="status-message">Hora de focar!</p>
  </div>

  <footer>
    Copiright &copy; 2026 Ailton A. Nakata 
  </footer>

  <audio id="alarm-sound"
    src="https://assets.mixkit.co/sfx/preview/mixkit-sci-fi-confirmation-alert-2038.mp3"
    preload="auto">
  </audio>

  <script>
    // Elementos
    const timeDisplay = document.getElementById('time');
    const pomodoroBtn = document.getElementById('pomodoro-btn');
    const shortBreakBtn = document.getElementById('short-break-btn');
    const longBreakBtn = document.getElementById('long-break-btn');

    const startBtn = document.getElementById('start-btn');
    const pauseBtn = document.getElementById('pause-btn');
    const resetBtn = document.getElementById('reset-btn');

    const statusMessage = document.getElementById('status-message');
    const alarmSound = document.getElementById('alarm-sound');
    const progressRing = document.getElementById('progress-ring');

    const soundToggle = document.getElementById('sound-toggle');
    const cycleInfo = document.getElementById('cycle-info');

    // Tempos (em segundos)
    const DURATIONS = {
      pomodoro: 25 * 60,
      'short-break': 5 * 60,
      'long-break': 15 * 60,
    };

    // Estado
    let currentMode = 'pomodoro';
    let timeLeft = DURATIONS[currentMode];
    let totalTime = DURATIONS[currentMode];

    let intervalId = null;
    let running = false;

    let soundEnabled = true;

    // Ciclo: a cada 4 pomodoros, pausa longa
    let pomodorosDoneInCycle = 0;
    const POMODOROS_PER_CYCLE = 4;

    // Helpers
    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function setActiveButton(mode) {
      document.querySelectorAll('.mode-selector button').forEach(btn => btn.classList.remove('active'));
      if (mode === 'pomodoro') pomodoroBtn.classList.add('active');
      if (mode === 'short-break') shortBreakBtn.classList.add('active');
      if (mode === 'long-break') longBreakBtn.classList.add('active');
    }

    function updateCycleInfo() {
      cycleInfo.textContent = `Ciclo: ${pomodorosDoneInCycle}/${POMODOROS_PER_CYCLE}`;
    }

    function updateProgress() {
      // progresso = quanto já passou (0 -> 1)
      const elapsed = totalTime - timeLeft;
      const ratio = totalTime === 0 ? 0 : (elapsed / totalTime);
      const deg = Math.max(0, Math.min(360, ratio * 360));

      progressRing.style.background = `conic-gradient(var(--cor-destaque) ${deg}deg, var(--cor-contorno-circulo) ${deg}deg)`;
    }

    function updateUI() {
      timeDisplay.textContent = formatTime(timeLeft);
      updateProgress();
      updateCycleInfo();
    }

    function setButtonsState(isRunning) {
      running = isRunning;
      startBtn.style.display = isRunning ? 'none' : 'inline-flex';
      pauseBtn.style.display = isRunning ? 'inline-flex' : 'none';
    }

    function playAlarm() {
      if (!soundEnabled) return;
      alarmSound.currentTime = 0;
      // Alguns navegadores bloqueiam autoplay; como é acionado por interação anterior (start), geralmente funciona.
      alarmSound.play().catch(() => {});
    }

    function announceMode() {
      if (currentMode === 'pomodoro') statusMessage.textContent = 'Foco total!';
      if (currentMode === 'short-break') statusMessage.textContent = 'Pausa curta: respira e volta.';
      if (currentMode === 'long-break') statusMessage.textContent = 'Pausa longa: recarrega a mente.';
    }

    function switchMode(mode, { reset = true } = {}) {
      stopTimer();
      currentMode = mode;
      totalTime = DURATIONS[mode];
      if (reset) timeLeft = totalTime;

      setActiveButton(mode);
      announceMode();
      updateUI();
    }

    function tick() {
      if (timeLeft > 0) {
        timeLeft--;
        updateUI();
        return;
      }

      // Terminou
      stopTimer();
      playAlarm();

      // Auto alternância
      if (currentMode === 'pomodoro') {
        pomodorosDoneInCycle++;
        updateCycleInfo();

        // Decide pausa curta ou longa
        const isLong = (pomodorosDoneInCycle % POMODOROS_PER_CYCLE === 0);
        statusMessage.textContent = isLong ? 'Pomodoro concluído! Pausa longa!' : 'Pomodoro concluído! Pausa curta!';
        switchMode(isLong ? 'long-break' : 'short-break');
      } else {
        statusMessage.textContent = 'Pausa concluída! Hora de focar!';
        switchMode('pomodoro');
      }
    }

    function startTimer() {
      if (running) return;

      // “Acorda” o áudio no primeiro clique (boa prática)
      if (soundEnabled) {
        alarmSound.play().then(() => {
          alarmSound.pause();
          alarmSound.currentTime = 0;
        }).catch(() => {});
      }

      setButtonsState(true);
      announceMode();
      intervalId = setInterval(tick, 1000);
    }

    function stopTimer() {
      if (intervalId) clearInterval(intervalId);
      intervalId = null;
      setButtonsState(false);
    }

    function pauseTimer() {
      stopTimer();
      statusMessage.textContent = 'Pausado.';
    }

    function resetTimer() {
      stopTimer();
      timeLeft = DURATIONS[currentMode];
      totalTime = DURATIONS[currentMode];
      statusMessage.textContent = 'Pronto para começar!';
      updateUI();
    }

    // Eventos de modo
    pomodoroBtn.addEventListener('click', () => switchMode('pomodoro'));
    shortBreakBtn.addEventListener('click', () => switchMode('short-break'));
    longBreakBtn.addEventListener('click', () => switchMode('long-break'));

    // Controles
    startBtn.addEventListener('click', startTimer);
    pauseBtn.addEventListener('click', pauseTimer);
    resetBtn.addEventListener('click', resetTimer);

    // Som
    soundToggle.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundToggle.setAttribute('aria-pressed', String(soundEnabled));
      soundToggle.innerHTML = soundEnabled
        ? '<i class="fas fa-volume-up"></i> Ativado'
        : '<i class="fas fa-volume-mute"></i> Mutado';
    });

    // Inicializa
    setActiveButton(currentMode);
    updateUI();
    announceMode();
  </script>
</body>
</html>
