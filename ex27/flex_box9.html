<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        
        #voltar>a{
            color: white;
        }
        #voltar{
            font-family: Arial, Helvetica, sans-serif;
            
            background-color: lightsalmon;
            padding: 10px;
            text-align: center;
        }
        a:hover{
            background-color: rgb(211, 166, 149);;
            padding: 10px;
            border-radius: 10px;
            font-weight: bolder;
            transform: rotate(30deg);
            animation-duration: 0.5s;
        }
        .container{
            display: flex; 
            flex-flow: row wrap;

            background-color: lightsalmon;

        }

        .item{
            flex-basis: 150px; 

            background-color: lightblue;
            text-align: center;
            padding: 5px;

            border: 1px solid black;
        }
        .container2{
            display: flex; 
            flex-flow: row nowrap;

            background-color: lightsalmon;

        }

        .item2{
            flex-basis: 150px; 

            background-color: lightblue;
            text-align: center;
            padding: 5px;

            border: 1px solid black;
        }
    </style>
    <title>Itens</title>
</head>
<body>
    <h1>Aula 8 – Tamanho base dos itens</h1>
    <hr>
    <h2>flex-flow: row wrap;</h2>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B - Conteúdo</div>
        <div class="item">C - Conteúdo Maior</div>
        <div class="item">D</div>
        <div class="item">E - Conteúdo um pouco Maior</div>
        <div class="item">F</div>
        <div class="item">G - Conteúdo muito, mas, muito maior</div>
    </div>
    <hr>
    <hr>
    <h2>flex-flow: row nowrap;</h2>
    <div class="container2">
        <div class="item2">A</div>
        <div class="item2">B - Conteúdo</div>
        <div class="item2">C - Conteúdo Maior</div>
        <div class="item2">D</div>
        <div class="item2">E - Conteúdo um pouco Maior</div>
        <div class="item2">F</div>
        <div class="item2">G - Conteúdo muito, mas, muito maior</div>
    </div>
    <hr>
    <div id="voltar">
        <a href="../html.html">Voltar</a>
    </div>
</body>
</html>
