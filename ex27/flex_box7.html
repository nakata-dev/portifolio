<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Itens Flexbox 07 | Order - Ailton A. Nakata</title>

  <!-- Botões padrão do seu site -->
  <link rel="stylesheet" href="../../site.css">
  <script src="../../site.js" defer></script>

  <style>
    /* ===== Base profissional escura ===== */
    *{ margin:0; padding:0; box-sizing:border-box; }

    body{
      background:#0b1220;
      color:rgba(255,255,255,.92);
      font-family: Arial, Helvetica, sans-serif;
      padding:16px;
    }

    /* ===== Botões acima do título ===== */
    .top-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }

    /* Remove hover antigo que girava tudo */
    a:hover{
      transform:none !important;
      animation:none !important;
    }

    hr{
      border:0;
      border-top:1px solid rgba(255,255,255,.12);
      margin:14px 0;
    }

    p{ line-height: 1.8; margin: 6px 0; color: rgba(255,255,255,.78); }
    h1, h3{ margin: 8px 0; }

    /* Voltar antigo: escondo para não poluir */
    #voltar{ display:none; }

    /* ===== Seu flex (mantido) só trocando tons ===== */
    .container{
      display:flex;
      flex-flow: row nowrap; /* mantido */
      background-color:#111a2e; /* era lightsalmon */

      border:1px solid rgba(255,255,255,.10);
      border-radius:12px;
      padding:10px;
      overflow:hidden;
    }

    .item{
      flex:auto; /* mantido */
      background-color:#0f2a44; /* era lightblue */
      color: rgba(255,255,255,.92);
      text-align:center;
      padding:20px;

      border:1px solid rgba(255,255,255,.12);
      border-radius:10px;
      font-weight:900;
    }

    /* ===== Regras didáticas: order (NÃO mexi) ===== */
    #i1{ order: 7; }
    #i2{ order: -2; }
    #i3{ order: 3; }
    #i4{ order: -5; }
    #i5{ order: 0; }
    #i6{ order: 10; }
    #i7{ order: -8; }
    #i8{ order: 4; }
  </style>
</head>

<body>
  <!-- ✅ Botões necessários acima do título -->
  <div class="top-actions">
    <a class="btn btn-secondary" href="../html.html">Voltar</a>
    <a class="btn btn-ghost" href="../../contato.html">Contato</a>
    <button class="btn btn-primary" data-open-modal type="button">Solicitar orçamento</button>
  </div>

  <h1>Aula 7 – Anatomia dos itens flexbox</h1>
  <hr>

  <h3>Lembrete:</h3>
  <p><strong>flex-flow:</strong> row nowrap;</p>

  <hr>

  <h1>Itens são flexíveis:</h1>

  <!-- ✅ Conteúdo original preservado -->
  <div class="container">
    <div class="item" id="i1">A</div>
    <div class="item" id="i2">B</div>
    <div class="item" id="i3">C</div>
    <div class="item" id="i4">D</div>
    <div class="item" id="i5">E</div>
    <div class="item" id="i6">F</div>
    <div class="item" id="i7">G</div>
    <div class="item" id="i8">H</div>
  </div>

  <hr>

  <!-- Modal padrão (se seu site.js já controla) -->
  <div class="modal-overlay" data-modal-overlay>
    <div class="modal" role="dialog" aria-modal="true" aria-label="Solicitar orçamento">
      <div class="modal-head">
        <strong>Solicitar orçamento</strong>
        <button class="modal-close" data-close-modal aria-label="Fechar" type="button">X</button>
      </div>

      <div class="modal-body">
        <p class="muted">Preencha em 30 segundos. Eu monto a proposta e te respondo.</p>

        <form class="form" data-budget-form autocomplete="on">
          <div class="field">
            <label>Seu nome</label>
            <input name="nome" placeholder="Ex: Ana" required autocomplete="name" />
          </div>

          <div class="field">
            <label>Seu negócio / segmento</label>
            <input name="negocio" placeholder="Ex: Barbearia, pizzaria, clínica..." required />
          </div>

          <div class="field">
            <label>Tipo de site</label>
            <select name="tipo" required>
              <option value="">Selecione</option>
              <option>Landing Page</option>
              <option>Site Institucional</option>
              <option>WordPress</option>
              <option>Loja (e-commerce)</option>
            </select>
          </div>

          <div class="field">
            <label>Objetivo principal</label>
            <select name="objetivo" required>
              <option value="">Selecione</option>
              <option>Gerar contatos no WhatsApp</option>
              <option>Vender um serviço/produto</option>
              <option>Passar credibilidade</option>
              <option>Captar leads (formulário)</option>
            </select>
          </div>

          <div class="field">
            <label>Prazo</label>
            <input name="prazo" placeholder="Ex: 10 dias" />
          </div>

          <div class="field">
            <label>Detalhes (opcional)</label>
            <textarea name="detalhes" placeholder="Páginas, conteúdo, fotos, logotipo, etc."></textarea>
          </div>

          <div class="top-actions">
            <button class="btn btn-primary" type="submit">Enviar no WhatsApp</button>
            <button class="btn btn-ghost" type="button" data-close-modal>Cancelar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
