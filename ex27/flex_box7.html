<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        #voltar>a{
             color: white;
        }
        #voltar{
            font-family: Arial, Helvetica, sans-serif;
            
            background-color: lightsalmon;
            padding: 10px;
            text-align: center;
        }
        a:hover{
            background-color: rgb(211, 166, 149);;
            padding: 10px;
            border-radius: 10px;
            font-weight: bolder;
            transform: rotate(30deg);
            animation-duration: 0.5s;
        }
        .container{
            display: flex;
            flex-flow: row nowrap;
            background-color: lightsalmon;

        }

        .item{
            flex: auto;
            background-color: lightblue;
            text-align: center;
            padding: 20px;

            border: 1px solid black;
        }
        #i1{
            order: 7;
        }
        #i2{
            order: -2;
        }
        #i3{
            order: 3;
        }
        #i4{
            order: -5;
        }
        #i5{
            order: 0;
        }
        #i6{
            order: 10;
        }
        #i7{
            order: -8;
        }
        #i8{
            order: 4;
        }

    </style>
    <title>Itens_flexbox</title>
</head>
<body>
    <h1>Aula 7 – Anatomia dos itens flexbox</h1>
    <hr>
    <h3>Lembrete:</h3>
    <p>flex-flow: row nowrap;</p>
    <hr>
    <h1>Itens são flexiveis:</h1>
    <div class="container">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>
        <div class="item" id="i8">H</div>
    
    </div>
    <hr>
    <div id="voltar">
        <a href="../estudos.html">Voltar</a>
    </div>
</body>
</html>
