<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box 5</title>
    <style>
        #voltar>a{
             color: white;
        }
        #voltar{
            font-family: Arial, Helvetica, sans-serif;
            
            background-color: #069937;
            padding: 10px;
            text-align: center;
        }
        a:hover{
            background-color: #40e09d8e;
            padding: 10px;
            border-radius: 10px;
            font-weight: bolder;
            transform: rotate(30deg);
            animation-duration: 0.5s;
        }


        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body{
            background-color: bisque;
        }

        main{ /*Pai*/
            background-color: rgb(0, 54, 0);
            padding: 10px;
            height: 90vh;
            width: 100vw;

            display: flex;
            flex: row nowrap;
            justify-content: center;
            align-items: center;
            
            section{
                background-color: rgb(71, 158, 71);
                height: 300px;
                width: 300px;
                border-radius: 15px;
                padding: 10px;


                h1,h3{
                    padding-top: 15px;
                    text-align: center;
                }
            }
        }
    </style>
</head>
<body>
    <main>
        <section>
            <h1>Teste de Centralização</h1>
            <br>
            <h3>Conf. Necessárias:</h3>
            <br>
            <br>
            <pre>
         display: flex;
         flex: row nowrap;
         justify-content: center;
         align-items: center;
            </pre>
        </section>
    </main>
    <div id="voltar">
        <a href="../html.html">Voltar</a>
    </div>
</body>
</html>
