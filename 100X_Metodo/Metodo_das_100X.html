<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🧠 Método das 100 VEZES</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0d0d0f;
            color: #e9e9e9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            font-size: 16px;
        }

        h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 2.2em;
            margin-bottom: 25px;
            color: #76c7ff;
            text-align: center;
        }

        p { text-align: center; color: #ccc; }

        .hint {
            font-size: 0.9em;
            color: #8fbbe9;
            margin-top: 5px;
            text-align: center;
        }

        textarea#inputText, .response-textarea {
            width: 100%; max-width: 600px;
            padding: 18px;
            border-radius: 15px;
            border: 2px solid #333;
            background: #141518;
            color: #e9e9e9;
            resize: vertical;
            margin-top: 15px;
            font-size: 16px;
            font-weight: 600;
            outline: none;
            transition: 0.2s;
        }

        textarea#inputText:focus, .response-textarea:focus {
            border-color: #76c7ff;
            box-shadow: 0 0 8px rgba(118,199,255,0.5);
        }

        button {
            background: #0077aa;
            color: white;
            padding: 14px 35px;
            border-radius: 35px;
            border: none;
            margin-top: 30px;
            cursor: pointer;
            font-weight: 700;
            font-size: 16px;
        }

        #memorizacao {
            display: none;
            margin-top: 30px;
            max-width: 600px;
            width: 90%;
            padding: 25px;
            border-radius: 20px;
            background: #1a1b1e;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }

        #nivel { color: #76c7ff; font-size: 1.4em; text-align: center; }

        #message {
            margin-top: 20px;
            font-size: 1.05em;
            text-align: left;
            background: #111;
            padding: 15px;
            border-radius: 10px;
        }

        #hiddenText {
            margin-top: 15px;
            padding: 15px;
            border: 2px dashed #76c7ff;
            border-radius: 10px;
            background: #0f1012;
            display: none;
            white-space: pre-wrap;
            color: #dcdcdc;
        }

        .char-error {
            background: rgba(255, 71, 87, 0.4);
            color: #ff6b81;
            padding: 2px 4px;
            border-radius: 4px;
            font-weight: bold;
        }

        .char-correct {
            color: #a8ffbf;
            font-weight: bold;
        }

        #finalMessage {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1b1e;
            color: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0,0,0,0.6);
            max-width: 90%;
            text-align: center;
            border: 2px solid #76c7ff;
        }
    </style>
</head>
<body>

    <h1>🧠 O Método das 100 Vezes</h1>
    <p>Cole abaixo o texto que deseja memorizar:</p>

    <textarea id="inputText" placeholder="Cole seu texto aqui..."></textarea>
    <button onclick="iniciar()">Iniciar Memorização</button>

    <div id="memorizacao">
        <h3 id="nivel"></h3>
        <p class="hint">Se esquecer alguma parte, pressione <strong>F8</strong>.</p>

        <textarea id="resposta" class="response-textarea" placeholder="Digite exatamente como no texto original"></textarea>

        <div id="message"></div>
        <div id="hiddenText"></div>
    </div>

    <div id="finalMessage">🟢 Parabéns! Você concluiu todas as etapas!</div>

<script>
let linhas = [];
let nivelAtual = 1;
let textoCompleto = "";

function iniciar() {
    textoCompleto = document.getElementById("inputText").value.trim();
    if (textoCompleto === "") {
        alert("Cole um texto antes de iniciar.");
        return;
    }

    linhas = textoCompleto.split(/\n+/).map(l => l.trim()).filter(l => l !== "");
    if (linhas.length === 0) linhas = [textoCompleto];

    document.getElementById("inputText").style.display = "none";
    document.querySelector("button").style.display = "none";
    document.getElementById("memorizacao").style.display = "block";
    document.getElementById("resposta").focus();

    atualizarNivel();
}

function atualizarNivel() {
    document.getElementById("nivel").innerHTML = `Etapa ${nivelAtual} — Digite até a linha ${nivelAtual}`;
    document.getElementById("resposta").value = "";
    document.getElementById("message").innerHTML = "";
    document.getElementById("hiddenText").style.display = "none";
}

const normalizar = t => t.replace(/\s/g, '').toLowerCase();

function validarResposta() {
    const resposta = document.getElementById("resposta").value;
    const alvo = linhas.slice(0, nivelAtual).join("\n");

    if (normalizar(resposta) === normalizar(alvo)) {
        document.getElementById("message").innerHTML = `🟢 <span class='success'>Correto!</span>`;

        nivelAtual++;
        if (nivelAtual > linhas.length) {
            document.getElementById("memorizacao").style.display = "none";
            document.getElementById("finalMessage").style.display = "block";
            return;
        }

        setTimeout(atualizarNivel, 800);
        return;
    }

    // REALCE DOS ERROS
    let output = "";
    for (let i = 0; i < alvo.length; i++) {
        if (resposta[i] === undefined) {
            output += `<span class='char-error'>_</span>`;
        } else if (resposta[i] === alvo[i]) {
            output += `<span class='char-correct'>${alvo[i]}</span>`;
        } else {
            output += `<span class='char-error'>${resposta[i]}</span>`;
        }
    }

    document.getElementById("message").innerHTML = `❌ Erros encontrados:<br><br>${output}`;
}

// ENTER → validar / SHIFT+ENTER → pular linha
document.getElementById("resposta").addEventListener("keydown", function(e) {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        validarResposta();
    }
});

// F8 → mostrar texto original
document.addEventListener("keydown", function(e) {
    if (e.key === "F8" && document.getElementById("memorizacao").style.display === "block") {
        e.preventDefault();
        const hidden = document.getElementById("hiddenText");
        hidden.textContent = linhas.slice(0, nivelAtual).join("\n\n");
        hidden.style.display = "block";
        setTimeout(() => hidden.style.display = "none", 6000);
    }
});
</script>

</body>
</html>
