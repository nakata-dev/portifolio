<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Hover</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        header{
            height: 80px;
            padding-bottom: 0px;
        }
        header>p{
            padding-top: 0px;
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.5;
            text-align: center;
        }
        div > p{    /* parágrafos que estão dentro de div não quero mexer */
            display: none;
        }
        div > p{
            text-align: center;
            display: block;
            margin: auto;
            color: white;
            background-color: rgb(47, 34, 168);
            padding: 10px;
            width: 200px;
            border-bottom-left-radius: 7px;
            border-top-right-radius: 7px;
        }
        div :hover {
            color: rgb(47, 34, 168);
        }
        
    </style>
</head>
<body>
    <header>
        <h1>Efeito Hover</h1>
        <p>por: Ailton A. Nakata</p>
    </header>
    <main>
        
        Passe o mouse aqui
        <br>
        <br>
        <div>
        <p>Esconder Texto</p>
        </div>
        
        <br>
        <br>
        <div id="voltar">
            <a href="../estudos.html">Voltar</a>
        </div>
        <br>
        <br>
    </main>
    
</body>
</html>
