<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Marhey:wght@300..700&display=swap');

        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }


        main{
            display: flex;
            flex: row nowrap;
            justify-content: center;
            align-items: center;
            background-color:#222222;
            height: 100vh;
        }
        button{
            font-family: "Marhey", sans-serif;
            display: flex;
            justify-content: center;
            /*marhey light*/
            background-color: #F27575;
            width: auto;
            padding: 20px;
            border-radius: 50px;
            color: white;
            font-size: 2em;
        }
        
        @keyframes pulsar{
            0%{
                transform:scale(1);
            }
            50%{
                transform:scale(1.08);
            }
            100%{
                transform:scale(1);
                cursor: pointer;
            }
        }
        button:hover{
            animation: pulsar 0.8s ease-in-out infinite;
        }

        a{
            color: white;
            text-decoration: none;
        }
        
    </style>

    <title>Botão II</title>
</head>
<body>
    
        <main>
            <button><a href="../estudos.html">Fala Mundão véio!</a></button>
        </main>
    
</body>
</html>
