<!DOCTYPE html>
<html lang="pt=br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>


@import url('https://fonts.googleapis.com/css2?family=Marhey:wght@300..700&display=swap');


        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            /*background-color:#000080;*/
            background-color: #222222;
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }


        button {
            display: flex;
            font-size: 2em;
            color: lightgray;
            background-color: black;
            padding: 15px;
            border-radius: 50px;
            text-decoration: none;
            font-family: "Marhey", cursive;
        }

        @keyframes pulsar {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        button:hover {
            animation: pulsar 0.8s ease-in-out infinite;
            cursor: pointer;
        }

        button a {
            text-decoration: none;
            color: white;
        }

        button {
            background-image: linear-gradient(to right, #E65B5B, #f78080);

        }
    </style>
    <title>Botão</title>
</head>

<body>
    <main>
        <button>
            <a href="../estudos.html">Olá Mundo!</a>
        </button>
    </main>
</body>

</html>
