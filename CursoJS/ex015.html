<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style2.css">
    <style>
        div#voltar{
        text-align: center; 
        font-family: 'Times New Roman', Times, serif;   
    }
    div#voltar a:hover{
        padding: 10px;
        background-color: rgba(125, 208, 235, 0.637);
        font-weight: bolder;
        transition-duration: 0.5s;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        border-radius: 5px;
        border: none;
        font-family: 'Times New Roman', Times, serif;
    }
    </style>
    <title>Verificador de Idade</title>
</head>
<body>
    <header>
        <h1>Verificador de Idade</h1>
    </header>
    <section>
        <div>
            <p>Ano de Nascimento:
            <input type="number" name="txtano" id="txtano" min="0"></p>
            <!--O <label> é uma etiqueta de identificação de um campo de formulário.
            Ele serve para descrever um input e melhorar a acessibilidade-->
            <p>sexo: 
                <input type="radio" name="radsex" id="mas" checked>
                <label for="mas">Masculino</label>
                <input type="radio" name="radsex" id="fem">
                <label for="fem">Feminino</label>
            </p>
            <p>
                <input type="button" value="Verificar" onclick="verificar()">
            </p>
        </div>
        <br>
        <br>
        <!--Não esqueça desta linha aqui embaixo-->
        <div id="res"></div>
        <br>
        <br>
        <div id="voltar">
            <a href="../js.html">Voltar</a>
        </div>
        <br><br>
    </section>
    <footer>
        &copy;Curso em vídeo
    </footer>
    <script src="verificar.js"></script>
</body>
</html>
