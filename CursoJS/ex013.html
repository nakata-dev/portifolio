<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condições - Parte II</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        *{
            line-height: 1.6;
        }
        input {
            width: 70px;
        }
        header{
            margin-bottom: 30px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Condicionais - Parte II</h1>
        <p>por: Ailton A. Nakata</p>
    </header>
    <main>
        <br>
        Idade: 
        <input type="number" name="idade" id="idade"> anos 
        <input type="button" value="Verificar" onclick="calcular()" > 
        <div id="res"></div>
        <br>
        <br>
        <div id="voltar">
        <a href="../js.html">Voltar</a>
        </div>
        <br>
        <br>
    </main>

    <script>
        function calcular() {
            var idade = Number(document.getElementById('idade').value);
            var res = document.getElementById('res');
            
            // sempre limpa antes
            res.innerHTML = `<p>Você tem ${idade} anos.</p>`; 

            if (idade < 16) {
                res.innerHTML += `<p>Não vota.</p>`;
            } else if (idade < 18 || idade > 65) {
                res.innerHTML += `<p>O voto é Opcional.</p>`;
            } else {
                res.innerHTML += `<p>O voto é Obrigatório!</p>`;
            }
        }
    </script>
</body>
</html>
