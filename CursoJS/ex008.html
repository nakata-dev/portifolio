<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../style.css">
  <title>Árvore Dom</title>
  <style>
    body {
      background: rgb(255, 255, 255);
      font-family: Arial, Helvetica, sans-serif;
    }

    main>p {
      color: rgb(0, 0, 0);
      font-size: 1em;
    }

    td {
      border: 3px dashed salmon;
      border-radius: 5px;
      text-align: center;
      margin: auto;
      padding: 10px;
    }

    main p {
      line-height: 1.8;
      list-style-position: inside;
      padding: 10px;
    }

    tr {
      margin-bottom: 30px;
    }

    #saida {
      margin: 30px auto;
      width: 60%;
      background: #f5f5f5;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
      text-align: justify;
    }

    #voltar a {
      text-decoration: none;
      color: #0077cc;
    }
  </style>
</head>

<body>
  <header>
    <h1>Árvore <strong>DOM</strong></h1>
    <p>por: Ailton A. Nakata</p>
  </header>

  <main>
    <p>Esta linha refere-se ao 'p' de número 1</p>
    <p>Esta linha refere-se ao 'p' de número 2</p>

    <table>
      <br>
      <caption>Esquema representativo</caption>
      <tr>
        <td>window</td>
      </tr>
      <tr>
        <td>location</td>
        <td>document</td>
        <td>history</td>
      </tr>
      <tr>
        <td>HTML</td>
      </tr>
      <tr>
        <td>Head</td>
      </tr>
      <tr>
        <td>meta</td>
        <td>title</td>
      </tr>
      <tr>
        <td>Body</td>
      </tr>
      <tr>
        <td>h1</td>
        <td>p</td>
        <td>p</td>
        <td>div</td>
      </tr>
      <tr>
        <td>string</td>
      </tr>
    </table>

    <div id="saida"></div> <!-- local onde o JS vai escrever -->

    <div id="voltar">
      <a href="../js.html">Voltar</a>
    </div>
    <br>
    <br>
  </main>

  <script>
    // Selecionando elementos
    var corpo = document.body;
    var p1 = document.getElementsByTagName('p')[1]; // segundo parágrafo

    // Muda a cor do parágrafo
    p1.style.color = 'blue';

    // Exibe o conteúdo de forma segura dentro da div "saida"
    var saida = document.getElementById('saida');
    saida.innerHTML = `
      <p>Está escrito assim: <strong>${p1.innerText}</strong></p>
      <p>O conteúdo HTML é: <em>${p1.innerHTML}</em></p>
    `;
  </script>
</body>
</html>
