<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <style>
        *{
            line-height: 1.8;
        }
    </style>
    <title>Detran</title>
</head>
<body>
    <header>
        <h1>Sistema de Multas</h1>
        <p>por: Ailton A. Nakata</p>
    </header>
    <main>
        <p><strong>60 km/h</strong> é a velocidade máxima permitida nesta via:</p>
        Velocidade do carro: <input type="number" name="txtvel" id="txtvel"> km/h. <input type="button" value="verificar" onclick="calcular()">
        <div id="res"></div>
        <br>
        <br>
        <div id="voltar">
            <a href="../js.html">Voltar</a>
        </div>
        <br>
        <br>
    </main>

    <script>
        function calcular(){
            txtv = window.document.getElementById('txtvel')
            var res = window.document.querySelector('div#res')
            var vel = Number(txtv.value)
            res.innerHTML = `<p>Sua velocidade é <strong>de ${vel} km/h</strong></p>`
            if (vel > 60){
                res.innerHTML += `<p>Você está <strong>multado</strong> por excesso de velocidade!</p>`
            }
            res.innerHTML += `<p>Dirija sempre com sinto de segurança!</p>`
        }
    </script>

</body>
</html>
