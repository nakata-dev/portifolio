<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interagindo com o DOM</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        div#area{
            display: block;
            margin: auto;
            border-radius: 15px;
            font: normal 20pt arial;
            background-color: gray;
            color: white;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;

        }
    </style>
</head>
<body>
    <header>
        <h1>Eventos DOM:</h1>
        <p>por: Ailton A. Nakata</p>
    </header>
    <br><br>
    <div id="area">
        interaja...
    </div>
    <br><br>
    <div id="voltar">
        <a href="../js.html">Voltar</a>
    </div>


    <script>
        var a = window.document.getElementById('area') 
        a.addEventListener('click', clicar)
        a.addEventListener('mouseenter', entrar)
        a.addEventListener('mouseout', sair)
        
        function clicar() {
            a.innerText='Clicou'
            a.style.background = 'red'
        }

        function entrar() {
            a.innerText='Entrou'
            a.style.background = 'lightgreen'
        }

        function sair() {
            a.innerText='Saiu!'
            a.style.background = 'orange'
        }
    </script>
</body>
</html>
