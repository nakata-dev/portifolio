<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>105X Japonês (Auto)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">105X</div>
      <div class="brandText">
        <div class="brandTitle">japones no automatico</div>
        <div class="brandSub" id="subStatus">leve e direto</div>
      </div>
    </div>

    <div class="hud">
      <button class="hudBtn" id="hudSound" title="som">🔊</button>
      <button class="hudBtn" id="hudVibe" title="vibracao">📳</button>
      <div class="hudItem" title="moedas"><span class="hudIcon">🪙</span><span id="hudCoinsVal">0</span></div>
      <button class="hudBtn" id="btnSettings" title="ajustes">⚙️</button>
    </div>
  </header>

  <main id="app" class="app" role="main"></main>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
