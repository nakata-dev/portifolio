<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <style>
        #voltar a:hover {
            background-color: rgb(255, 255, 255);
            border-radius: 50px;
            color: rgba(0, 0, 0, 0.651);
            padding: 10px;
            text-decoration: none;
            transform: scale(1.1);
            transition: transform(-10px, -10px);
        }

        div#voltar {
            color: rgba(255, 255, 255, 0.411);
            font-weight: bold;
            padding-left: 5px;
            text-align: center;
            padding: 10px;

        }

        #voltar>a {
            text-decoration: none;
            color: rgba(240, 248, 255, 0.575);
            padding: 10px;
            border-radius: 50px;
            background-color: #2626FE;
            transition: 1s;
        }

        footer {
            background-color: white;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 10px;
            z-index: 9999;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.15);
            text-align: center;

        }
    </style>
    <title>Projeto_Social</title>
</head>

<body>
    
    <main>
        <section id="telefone">
            <iframe src="home.html" name="tela" id="tela"></iframe>
        </section>
        <section id="rede-social">
            <a href="https://ikigaiweb.com.br/" ><img src="imagens/tsuru-ikigaiweb.png" alt="logo-facebook"></a><br>
            <a href="home.html" target="tela"><img src="imagens/logo-home.jpg" alt="home"></a><br>
            <a href="youtube.html" target="tela"><img src="imagens/logo-youtube.jpg" alt="logo-youtube"></a><br>
            <a href="github.html" target="tela"><img src="imagens/logo-github.jpg" alt="GitHub"></a><br>
            <a href="instagram.html" target="tela"><img src="imagens/logo-instagram.jpg" alt="logo-instagram"></a><br>
            <a href="twitter.html" target="tela"><img src="imagens/logo-twitter.jpg" alt="logo-twitter"></a><br>
            <a href="facebook.html" target="tela"><img src="imagens/logo-facebook.jpg" alt="logo-facebook"></a><br>
        </section>
        <br><br>
        <footer>
            &copy; Desenvolvido por Ailton A. Nakata
        </footer>
        <br><br>
        <br><br>
        <br><br>
    </main>
</body>

</html>
