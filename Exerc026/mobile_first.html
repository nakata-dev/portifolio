<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Querie</title>
    <link rel="stylesheet" href="estilos/style.css" media="all">
    <link rel="stylesheet" href="estilos/media_query.css">
    <style>
         #voltar {
            text-align: center;
        }
        a{
        font-weight: bolder;
        color: rgb(255, 255, 255);
        font-family: Arial, Helvetica, sans-serif;
        text-shadow: 5px 5px 10px black;
        }
        #voltar a:hover {
            background-color: rgba(25, 47, 247, 0.637);
            padding: 10px;
            font-weight: bolder;
            border-radius: 10px;
            transform: scale(1.1);
            transition-duration: 0.5s;
        }
    </style>
</head>
<body>
    <main>
        <h1>Mobile First</h1>
        <img id="phone" src="img2/icon-phone.png" alt="Acessando via Smartphone">
        <img id="tablet" src="img2/icon-tablet.png" alt="Acessando pelo tablet">
        <img id="print" src="img2/icon-print.png" alt="Versão para Impressão">
        <img id="pc" src="img2/icon-pc.png" alt="Versão para Desktop">
        <img id="tv" src="img2/icon-tv.png" alt="Versão para TV">
        <br><br>
        <div id="voltar">
            <a href="../estudos.html">Voltar</a>
        </div>
        <br><br>

    </main>
</body>
</html>
