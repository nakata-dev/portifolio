<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    
    <title>O Mapa Mundi</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        header{
            padding: 10px;
            height: 80px;
            background: linear-gradient(135deg, #1e90ff, #00bfff);
            text-align: center;
            color: white;
            text-shadow: 2px 2px 3px rgba(0, 0, 0, 0.63);
        }
        #container{
            position: relative;
            height: auto;
            padding: 10px;
            

        }
        h2,p{
            text-align: center;
        }
        
        #voltar{
            text-align: center;
            background: linear-gradient(135deg, #1e90ff, #00bfff);
            padding: 10px;

        }
        #voltar > a:hover{
            text-align: center;
            text-decoration: none;
            background-color: rgba(253, 253, 253, 0.644);
            color: rgb(0, 6, 41);
            font-weight: bold;
            transition-duration:1s ;
            width: 80px;
            padding: 10px;
            border-radius: 10px;

        }

        #mapa_mundi img{
            position: relative;
            display: inline-block;
            grid-template-columns: repeat(3, auto);
            gap: 5px;
            width: 100px;
            height: auto;
           
              
        }
       #mapa_mundi img:hover{
            transform: scale(1.2);
            animation-duration: 0.5s;
       }
     
    </style>
</head>
<body>
    <header>
        <h1>Desafio do Mapa Mundi</h1>
        <p>por: Ailton A. Nakata</p>
    </header>
    <main>
        
        <h2>Alinhamento</h2>
            <br>
            <section id="container">
                <div id="mapa_mundi">
                    <p><img src="imagens/mapa03.png" alt="imagem 001">
                    <img src="imagens/mapa07.png" alt="imagem 002">
                    <img src="imagens/mapa05.png" alt="imagem 003"><br>
                    <img src="imagens/mapa09.png" alt="imagem 004">
                    <img src="imagens/mapa01.png" alt="imagem 005">
                    <img src="imagens/mapa08.png" alt="imagem 006"> <br>
                    <img src="imagens/mapa06.png" alt="imagem 007">
                    <img src="imagens/mapa02.png" alt="imagem 008">
                    <img src="imagens/mapa04.png" alt="imagem 009"></p>
                </div>
            </section>
            
        <br>
        <br>
        <div id="voltar">
            <a href="../../../desafios.html">Voltar</a>
        </div>
        <br>
        <br>
    </main>
</body>
</html>
