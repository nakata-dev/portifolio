<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posicionamento</title>
    <style>
        body{
            height: 98vh; /*indica a altura da viewport*/
            border: 2px dashed black;
            background-image: url('http://gustavoguanabara.github.io/html-css/imagens/mascote.png');
            background-size: 100px 100px;
            background-repeat: no-repeat;
            background-position: center center;
        }
        body pre > h2{

        }
        div#voltar{
        text-align: center;    
    }
         div#voltar a:hover{

         transition-duration: 0.5s;
         box-shadow: 0 4px 10px rgba(0,0,0,0.2);
         border-radius: 5px;
         border: none;
    }

</head>

        }
        </p>
    </pre>
    <br><br>
    <br><br>
