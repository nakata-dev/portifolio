<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Ajuda o navegador a saber que a página suporta claro/escuro -->
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0b0d12" />

  <title>Jogo da Velha</title>

  <!-- BOOTSTRAP DE TEMA (antes do CSS) para evitar falha/flash e depender menos do app.js -->
  <script>
    (function () {
      try {
        var key = "ttt_theme_v1"; // mesmo do app.js
        var mode = localStorage.getItem(key) || "auto";
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var effective = mode === "auto" ? (prefersDark ? "dark" : "light") : mode;

        var html = document.documentElement;
        html.classList.remove("theme-light", "theme-dark");
        html.classList.add(effective === "dark" ? "theme-dark" : "theme-light");

        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", effective === "dark" ? "#0b0d12" : "#f4f4f4");
      } catch (e) {}
    })();
  </script>

  <!-- Cache-busting (mude o número quando publicar) -->
  <link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>
  <main class="app" aria-label="Jogo da Velha">
    <header class="topo">
      <h1>Jogo da Velha</h1>

      <div class="barra" aria-label="Controles do jogo">
        <div class="grupo" role="group" aria-label="Modo de jogo">
          <button id="modoPvp" class="seg active" type="button" aria-pressed="true">2 Jogadores</button>
          <button id="modoCpu" class="seg" type="button" aria-pressed="false">Vs Computador</button>
        </div>

        <div class="direita">
          <div class="status" aria-label="Jogador atual">
            <span class="rotulo">Vez</span>
            <span id="chipJogador" class="chip chip-x" aria-live="polite">X</span>
          </div>

          <button
            id="temaToggle"
            class="icon-btn"
            type="button"
            aria-label="Alternar tema"
            aria-pressed="false"
            title="Alternar tema"
          >🌙</button>
        </div>
      </div>
    </header>

    <section class="jogo" aria-label="Área do jogo">
      <div id="tabuleiro" aria-label="Tabuleiro do jogo"></div>

      <div id="mensagem" aria-live="polite"></div>

      <div class="rodape-card" aria-label="Placar e opções">
        <div class="placar" aria-label="Placar">
          <span class="badge" id="scoreX" aria-label="Placar do X">X: 0</span>
          <span class="badge" id="scoreO" aria-label="Placar do O">O: 0</span>
          <span class="badge" id="scoreE" aria-label="Empates">E: 0</span>
        </div>

        <div class="opcoes" aria-label="Opções">
          <label class="switch">
            <input id="salvarPlacar" type="checkbox" />
            <span class="slider" aria-hidden="true"></span>
            <span class="txt">Salvar</span>
          </label>

          <button id="zerarPlacar" class="btn-sec" type="button">Zerar placar</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="rodape">
    Copyright @ Ailton A. Nakata
  </footer>

  <!-- Cache-busting -->
  <script src="app.js?v=3" defer></script>
</body>
</html>
