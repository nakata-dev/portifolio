<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧠 Caça-Palavras</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app">
    <header class="top">
      <div class="title">
        <h1>🧠 Caça-Palavras</h1>
        <p class="sub" id="levelLabel">Nível 1</p>
      </div>

      <div class="hud">
        <div class="hud-item">
          <span class="hud-label">Tempo</span>
          <span class="hud-value" id="timeLabel">00:00</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">Movimentos</span>
          <span class="hud-value" id="movesLabel">0</span>
        </div>
      </div>
    </header>

    <main class="content">
      <section class="card">
        <div id="board" class="board" aria-label="Tabuleiro do caça-palavras"></div>
      </section>

      <section class="card words-card">
        <div class="words-head">
          <h2>Palavras</h2>
          <div class="progress" aria-label="Progresso do nível">
            <span id="progressBar"></span>
          </div>
        </div>
        <div id="wordList" class="words"></div>

        <!-- Mensagem inicial para você ver se o JS mexe aqui -->
        <p class="msg" id="message" aria-live="polite">
          Carregando jogo…
        </p>
      </section>

      <section class="card dev-card" id="devPanel" hidden>
        <div class="dev-head">
          <h2>Editor de Níveis</h2>
          <button class="btn ghost" id="closeDev" type="button">Fechar</button>
        </div>

        <p class="hint">
          Cole um JSON de níveis (array). Exemplo já vem preenchido.
          Clique em “Aplicar” para testar rapidamente.
        </p>

        <textarea id="levelsInput" class="dev-textarea" spellcheck="false"></textarea>

        <div class="row">
          <button class="btn primary" id="applyLevels" type="button">Aplicar</button>
          <button class="btn danger" id="resetLevels" type="button">Restaurar padrão</button>
        </div>
      </section>
    </main>

    <nav class="mobilebar" aria-label="Ações rápidas">
      <button class="btn ghost" id="btnHint" type="button">💡 Dica</button>
      <button class="btn ghost" id="btnRestart" type="button">🔁 Reiniciar</button>
      <button class="btn primary" id="btnNext" type="button">➡️ Próximo</button>
      <button class="btn ghost" id="btnDev" type="button" title="Editor de níveis">⚙️</button>
    </nav>

    <footer class="footer">
      Copyright @ 2026 - Ailton A. Nakata
    </footer>
  </div>

  <script>
    // Se o app.js falhar (404/caminho errado), você vai ver aqui na tela.
    window.addEventListener("error", function (ev) {
      const msg = ev && ev.message ? String(ev.message) : "";
      if (!msg) return;
      const el = document.getElementById("message");
      if (el) el.textContent = "❌ Erro no JavaScript: " + msg;
    });
  </script>

  <script
    src="app.js"
    defer
    onerror="document.getElementById('message').textContent='❌ app.js não carregou. Verifique se o arquivo se chama exatamente app.js e está na mesma pasta do index.html.'">
  </script>
</body>
</html>
