<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Caça-Palavras</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: url('https://picsum.photos/800/1200?blur=3') no-repeat center center fixed;
    background-size: cover;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    color: #fff;
}

header {
    text-align: center;
    margin: 12px 0;
}

header h1 {
    font-size: 1.3rem;
  
}

.nivel {
    margin-top: 6px;
    background: #22c55e;
    padding: 6px 18px;
    border-radius: 20px;
    font-weight: bold;
}

main {
    width: 100%;
    max-width: 420px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 4px;
    background: rgba(15, 23, 36, 0.9);
    padding: 10px;
    border-radius: 14px;
    touch-action: none;
}

.cell {
    width: 32px;
    height: 32px;
    background: #0f1724;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    font-weight: bold;
    border-radius: 6px;
    user-select: none;
}

.cell.selected {
    background: #f59e0b;
    color: #000;
}

.palavras {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
}

.palavras span {
    background: rgba(0,0,0,0.6);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 0.9rem;
}

@media (max-width: 480px) {
    .cell {
        width: 28px;
        height: 28px;
        font-size: 1rem;
    }
}
</style>
</head>

<body>
<header>
    <h1>NÍVEL 1</h1>
    <div class="nivel">AVENTURA</div>
</header>

<main>
    <div class="grid" id="grid"></div>
    <div class="palavras" id="lista-palavras"></div>
</main>

<script>
const palavras = ["TESOURO","MAPA","CAVERNA","HERÓI","VILÃO","SIGILO","PISTA","CÓDIGO","PORTAL","ORBE"];
const gridSize = 10;

const grid = document.getElementById("grid");
const lista = document.getElementById("lista-palavras");

let selecionando = false;

function criarGrid() {
    for (let i = 0; i < gridSize * gridSize; i++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.textContent = String.fromCharCode(65 + Math.floor(Math.random() * 26));

        cell.addEventListener("touchstart", () => {
            selecionando = true;
            cell.classList.add("selected");
        });

        cell.addEventListener("touchmove", (e) => {
            if (!selecionando) return;
            const touch = e.touches[0];
            const el = document.elementFromPoint(touch.clientX, touch.clientY);
            if (el && el.classList.contains("cell")) {
                el.classList.add("selected");
            }
        });

        cell.addEventListener("touchend", () => {
            selecionando = false;
        });

        grid.appendChild(cell);
    }
}

function mostrarPalavras() {
    palavras.forEach(p => {
        const span = document.createElement("span");
        span.textContent = p;
        lista.appendChild(span);
    });
}

criarGrid();
mostrarPalavras();
</script>
</body>
</html>
