<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forca Fun</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="logo">🎈</div>
        <div>
          <h1>Forca Fun</h1>
          <p class="sub" id="levelLabel">Nível 1 • Categoria</p>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="k">⏱</span>
          <span class="v" id="timer">00:00</span>
        </div>
        <div class="stat">
          <span class="k">❌</span>
          <span class="v"><b id="errors">0</b>/6</span>
        </div>
        <div class="stat">
          <span class="k">💡</span>
          <span class="v" id="hints">2</span>
        </div>
      </div>
    </header>

    <main class="content">
      <section class="card stage">
        <div class="stage-left">
          <div class="chip" id="categoryChip">Categoria</div>

          <svg id="hangmanSvg" viewBox="0 0 220 220" class="hangman" aria-hidden="true">
            <path class="gallow" d="M30 200 H190" />
            <path class="gallow" d="M60 200 V35" />
            <path class="gallow" d="M60 35 H150" />
            <path class="gallow" d="M150 35 V55" />

            <path id="part-rope" class="part" d="M150 55 V72" />
            <circle id="part-head" class="part" cx="150" cy="90" r="18" />
            <path id="part-body" class="part" d="M150 108 V150" />
            <path id="part-armL" class="part" d="M150 120 L128 138" />
            <path id="part-armR" class="part" d="M150 120 L172 138" />
            <path id="part-legL" class="part" d="M150 150 L132 176" />
            <path id="part-legR" class="part" d="M150 150 L168 176" />

            <g id="part-face" class="part face">
              <path d="M144 88 l-6 -6" />
              <path d="M138 88 l6 -6" />
              <path d="M162 88 l-6 -6" />
              <path d="M156 88 l6 -6" />
              <path d="M142 100 q8 8 16 0" />
            </g>
          </svg>

          <p class="tip" id="tipText">Toque nas letras para adivinhar 🎯</p>
        </div>

        <div class="stage-right">
          <div class="bigstats">
            <div class="pill">
              <span>⭐ XP</span>
              <b id="xpLabel">0</b>
            </div>
            <div class="pill">
              <span>🪙 Moedas</span>
              <b id="coinsLabel">0</b>
            </div>
            <div class="pill">
              <span>🔥 Sequência</span>
              <b id="streakLabel">0</b>
            </div>
          </div>

          <div class="actions">
            <button class="btn btn-3d blue" id="btnNew" type="button">🔁 Nova</button>
            <button class="btn btn-3d yellow" id="btnHint" type="button">💡 Dica</button>
          </div>

          <div class="actions">
            <button class="btn btn-3d green" id="btnSkip" type="button" title="Custa 3 moedas">
              ⏭ Pular (3🪙)
            </button>
          </div>

          <div class="toggles">
            <label class="toggle">
              <input type="checkbox" id="toggleSound" checked />
              <span>🔊 Som</span>
            </label>
            <label class="toggle">
              <input type="checkbox" id="toggleVibe" checked />
              <span>📳 Vibração</span>
            </label>
          </div>
        </div>
      </section>

      <section class="card">
        <div id="word" class="word" aria-label="Palavra"></div>
        <div class="message" id="message" aria-live="polite"></div>
      </section>

      <section class="card keyboard-card" aria-label="Teclado">
        <div id="keyboard" class="keyboard"></div>
      </section>
    </main>

    <footer class="footer">Copyright @ 2026 - Ailton A. Nakata</footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
