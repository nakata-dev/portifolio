<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forca Pro</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="logo">🪢</div>
        <div class="title">
          <h1>Forca Pro</h1>
          <p class="sub" id="levelLabel">Nível 1</p>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><span class="k">⏱</span><span class="v" id="timer">00:00</span></div>
        <div class="stat"><span class="k">❌</span><span class="v"><span id="errors">0</span>/6</span></div>
        <div class="stat"><span class="k">💡</span><span class="v" id="hints">2</span></div>
      </div>
    </header>

    <main class="stage">
      <!-- Palco da Forca -->
      <section class="card stage-left">
        <svg class="hangman" viewBox="0 0 260 260" aria-label="Forca">
          <!-- Estrutura -->
          <path class="gallow" d="M40 230 H220" />
          <path class="gallow" d="M80 230 V50" />
          <path class="gallow" d="M80 50 H170" />
          <path class="gallow" d="M170 50 V78" />

          <!-- Partes (aparecem com erros) -->
          <circle class="part" id="p1" cx="170" cy="96" r="18" />
          <path class="part" id="p2" d="M170 114 V160" />
          <path class="part" id="p3" d="M170 128 L145 150" />
          <path class="part" id="p4" d="M170 128 L195 150" />
          <path class="part" id="p5" d="M170 160 L150 200" />
          <path class="part" id="p6" d="M170 160 L190 200" />

          <!-- carinha no final -->
          <path class="part face" id="face1" d="M163 92 L167 96" />
          <path class="part face" id="face2" d="M167 92 L163 96" />
          <path class="part face" id="face3" d="M173 92 L177 96" />
          <path class="part face" id="face4" d="M177 92 L173 96" />
          <path class="part face" id="face5" d="M164 104 Q170 110 176 104" />
        </svg>

        <p class="tip" id="tip">Dica: use 💡 quando travar.</p>

        <div class="toggles">
          <label class="toggle">
            <input type="checkbox" id="soundToggle" checked />
            Sons
          </label>
          <label class="toggle">
            <input type="checkbox" id="vibeToggle" checked />
            Vibração
          </label>
        </div>

        <div class="actions">
          <button class="btn btn-3d yellow" id="btnHint" type="button">💡 Dica</button>
          <button class="btn btn-3d blue" id="btnRestart" type="button">🔁 Reiniciar</button>
        </div>
      </section>

      <!-- Palavra + teclado -->
      <section class="card stage-right">
        <div class="word" id="word"></div>
        <div class="message" id="message"></div>
        <div class="card keyboard-card">
          <div id="keyboard" class="keyboard" aria-label="Teclado"></div>
        </div>
      </section>
    </div>
    </main>
    
    <script src="app.js"></script>
</body>
</html>
