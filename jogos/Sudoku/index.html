<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧩 Sudoku Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">🧩</div>
        <div>
          <h1>Sudoku Pro</h1>
          <p class="sub" id="levelLabel">Nível: Fácil</p>
        </div>
      </div>

      <div class="top-actions">
        <button class="btn ghost" id="btnNew" type="button" title="Novo jogo">Novo</button>
        <button class="btn ghost" id="btnContinue" type="button" title="Continuar jogo salvo">Continuar</button>
      </div>
    </header>

    <section class="hud card">
      <div class="chip">
        <span class="chip-ico">⏱</span>
        <div>
          <span class="chip-label">Tempo</span>
          <span class="chip-value" id="timer">00:00</span>
        </div>
      </div>

      <div class="chip">
        <span class="chip-ico">❌</span>
        <div>
          <span class="chip-label">Erros</span>
          <span class="chip-value"><span id="errors">0</span>/3</span>
        </div>
      </div>

      <div class="chip">
        <span class="chip-ico">💡</span>
        <div>
          <span class="chip-label">Dicas</span>
          <span class="chip-value" id="hints">3</span>
        </div>
      </div>

      <div class="chip best">
        <span class="chip-ico">🏁</span>
        <div>
          <span class="chip-label">Melhor</span>
          <span class="chip-value" id="bestScore">—</span>
        </div>
      </div>
    </section>

    <main class="main">
      <section class="board-wrap card">
        <div id="grid" class="grid" aria-label="Tabuleiro do Sudoku"></div>
        <p class="message" id="message" aria-live="polite"></p>
      </section>

      <section class="panel card">
        <div class="panel-row">
          <button class="btn" id="btnHint" type="button">💡 Dica</button>
          <button class="btn" id="btnErase" type="button">⌫ Apagar</button>
          <button class="btn" id="btnPencil" type="button" aria-pressed="false">✎ Lápis</button>
        </div>

        <div class="panel-row">
          <button class="btn ghost" id="btnUndo" type="button">↶ Desfazer</button>
          <button class="btn ghost" id="btnSave" type="button">💾 Salvar</button>
          <button class="btn danger" id="btnReset" type="button">Reset nível</button>
        </div>

        <div class="keyboard" id="keyboard" aria-label="Teclado numérico"></div>
      </section>
    </main>

    <footer class="footer">
      Copyright &copy; 2025 - Ailton A. Nakata
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
