<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Cacheta Royale: O Blefe do Totó</title>

  <meta name="theme-color" content="#0a2012" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div id="mesa">
    <div id="topo">
      <div id="pl-toto" class="p-unit">
        <div class="p-name">TOTÓ</div>
        <div class="p-score" id="sc-toto">00</div>
      </div>

      <div class="area-pet-topo">
        <div class="avatar" aria-hidden="true">🐶</div>

        <!-- fala com botão de zoeira embutido (não altera estética) -->
        <div class="fala-wrap">
          <div class="fala-box" id="fala">Bora pra cima! 😼</div>

          <!-- aparece só quando a Maia joga o coringa fora -->
          <button id="btn-zueira" class="btn-zueira hidden" type="button" aria-label="Tirar sarro da Maia">
            😹
          </button>
        </div>
      </div>

      <div id="pl-maia" class="p-unit">
        <div class="p-name">MAIA</div>
        <div class="p-score" id="sc-maia">00</div>
      </div>
    </div>

    <div id="centro">
      <div id="slot-monte" class="slot-wrap" data-acao="monte" role="button" tabindex="0" aria-label="Comprar do monte">
        <div class="monte-container"></div>
        <div class="slot-label">MONTE</div>
      </div>

      <div class="slot-wrap" aria-label="Vira">
        <div id="vira-area"></div>
        <div class="slot-label">VIRA</div>
      </div>

      <div id="slot-lixo" class="slot-wrap" data-acao="lixo" role="button" tabindex="0" aria-label="Comprar do lixo">
        <div id="lixo-area"></div>
        <div class="slot-label">LIXO</div>
      </div>
    </div>

    <div id="container-mao"></div>

    <div id="controles">
      <button id="btn-cmd" class="btn" type="button" data-acao="confirmar">COMPRAR</button>
      <button id="btn-bati" class="btn btn-bati" type="button" data-acao="bati">BATI!</button>
      <button class="btn btn-reset" type="button" data-acao="novo">NOVO</button>
    </div>

    <footer>Copyright @ 2026 - Ailton A. Nakata</footer>

    <!-- OVERLAY (vitória / conferência) -->
    <div id="overlay-vitoria" class="overlay hidden" aria-hidden="true">
      <div class="overlay-card" role="dialog" aria-modal="true" aria-labelledby="tit-vitoria">
        <div class="badge-win" id="badge-icone" aria-hidden="true">🏆</div>
        <div id="tit-vitoria" class="overlay-title">VOCÊ BATEU!</div>
        <div id="sub-vitoria" class="overlay-sub">Bonito, hein! 💥</div>

        <div id="maia-cards" class="maia-cards hidden" aria-label="Cartas da Maia"></div>

        <div id="veredito-actions" class="overlay-actions hidden">
          <button id="btn-parabens" class="btn btn-bati" type="button">PARABÉNS!</button>
          <button id="btn-piou" class="btn btn-reset" type="button">PIOU HEIM!</button>
        </div>

        <div id="default-actions" class="overlay-actions">
          <button id="btn-jogar-novamente" class="btn btn-bati" type="button">JOGAR DE NOVO</button>
          <button id="btn-fechar-overlay" class="btn btn-reset" type="button">FECHAR</button>
        </div>

        <div class="shine" aria-hidden="true"></div>
      </div>

      <div id="confetti-layer" aria-hidden="true"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
